<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AI 群聊室</title>
  <meta name="description" content="和正义的小羊一起聊聊天，P2P 加密，阅后即焚，分享链接即可加入">
  <meta property="og:title" content="正义的小羊 · AI 群聊室">
  <meta property="og:description" content="邀请朋友加入群聊，AI 小羊旁听，关键时刻忍不住说两句">
  <meta property="og:image" content="sheep-avatar-256.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <script>window.Peer || document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.1/dist/peerjs.min.js"><\/script>')</script>
  <style>
    :root {
      --duo-green: #4a90e2;
      --duo-green-dark: #3478c8;
      --duo-green-light: #d4e6fa;
      --duo-blue: #4a90e2;
      --duo-blue-dark: #3478c8;
      --duo-purple: #ce82ff;
      --duo-orange: #ff9600;
      --duo-red: #ff4b4b;
      --duo-yellow: #f6c544;
      --duo-bg: #eaf2fc;
      --duo-card: #ffffff;
      --duo-text: #2c3e50;
      --duo-text-light: #7a8b9c;
      --duo-border: #d0e0f0;
      --duo-shadow: 0 2px 0 #cfdcec;
      --duo-radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Nunito", "Segoe UI", sans-serif;
      background: var(--duo-bg);
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      color: var(--duo-text);
    }
    .hidden { display: none !important; }

    /* ===== Header ===== */
    .header {
      background: var(--duo-card);
      padding: 12px 16px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 2px solid var(--duo-border);
      flex-shrink: 0;
    }
    .header .dog-mini { width: 32px; height: 32px; }
    .header .title { flex: 1; font-size: 17px; font-weight: 800; color: var(--duo-text); }
    .header .badge {
      font-size: 12px; font-weight: 700;
      background: var(--duo-green); color: white;
      padding: 6px 14px; border-radius: 20px; cursor: pointer;
      border: none; transition: transform 0.1s;
      box-shadow: 0 2px 0 var(--duo-green-dark);
    }
    .header .badge:active { transform: scale(0.95) translateY(1px); box-shadow: 0 1px 0 var(--duo-green-dark); }
    .header .btn-sm {
      font-size: 12px; font-weight: 700;
      background: #f0edff; color: #6c5ce7;
      border: 1.5px solid #d5d0f5; padding: 6px 14px; border-radius: 20px; cursor: pointer;
    }
    .header .btn-sm:active { transform: scale(0.95); }
    .header .btn-danger { background: #fff0f0; color: #e63946; border: 1.5px solid #ffc8c8; }
    .header .feedback-btn {
      font-size: 12px; opacity: 0.3; cursor: pointer;
      transition: opacity 0.3s; padding: 2px 6px;
      color: var(--duo-text-light); text-decoration: none;
    }
    .header .feedback-btn:hover { opacity: 0.7; }
    .feedback-card { max-width: 360px; }
    .feedback-card h3 { margin: 0 0 12px; font-size: 16px; color: var(--duo-text); }
    .feedback-card textarea {
      width: 100%; border: 1.5px solid var(--duo-border); border-radius: 10px;
      padding: 10px; font-size: 14px; resize: none; font-family: inherit;
      box-sizing: border-box; outline: none;
    }
    .feedback-card textarea:focus { border-color: var(--duo-green); }
    .feedback-img-row {
      display: flex; align-items: center; gap: 8px; margin: 10px 0 6px;
    }
    .feedback-img-btn {
      font-size: 13px; color: var(--duo-green); cursor: pointer;
      padding: 4px 12px; border: 1.5px solid var(--duo-border); border-radius: 16px;
      background: #f8fbff;
    }
    #feedbackImgCount { font-size: 12px; color: #999; }
    .feedback-preview {
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px;
    }
    .feedback-preview img {
      width: 60px; height: 60px; object-fit: cover; border-radius: 8px;
      border: 1.5px solid var(--duo-border);
    }
    .feedback-actions {
      display: flex; gap: 10px;
    }
    .feedback-actions .btn-full { flex: 1; }

    /* ===== Online bar ===== */
    .online-bar {
      background: var(--duo-card);
      padding: 8px 14px;
      font-size: 12px; color: var(--duo-text);
      border-bottom: 1px solid var(--duo-border);
      display: flex; align-items: center; gap: 6px;
      flex-wrap: wrap; flex-shrink: 0;
      overflow: visible; max-height: 60px;
      position: sticky; top: 0; z-index: 20;
    }
    .online-bar .tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: #e8f4fd; padding: 4px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 700; color: var(--duo-text);
      border: 1.5px solid #c8e2f8; position: relative;
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .online-bar .tag.offline { opacity: 0.35; transform: scale(0.92); background: #f5f5f5; border-color: #e0e0e0; color: #999; }
    .online-bar .dot { width: 8px; height: 8px; border-radius: 50%; }
    .online-bar .dot.on { background: #34c759; box-shadow: 0 0 4px rgba(52,199,89,0.5); }
    .online-bar .dot.off { background: #ccc; }
    /* 打字动画铅笔 */
    .online-bar .tag .typing-pencil {
      display: none; font-size: 11px; margin-left: 2px;
      animation: pencilWrite 0.6s ease-in-out infinite alternate;
    }
    .online-bar .tag.is-typing .typing-pencil { display: inline-block; }
    .online-bar .tag.is-typing { border-color: #f6c544; background: #fff9e6; }
    @keyframes pencilWrite {
      0% { transform: rotate(-12deg) translateY(0); }
      100% { transform: rotate(12deg) translateY(-2px); }
    }
    /* 飞向头像的表情 */
    .fly-emoji {
      position: fixed; z-index: 100; pointer-events: none;
      font-size: 40px; line-height: 1; will-change: transform, opacity, left, top;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.15));
    }

    /* ===== Connection status ===== */
    .conn-status { text-align: center; padding: 6px; font-size: 12px; font-weight: 700; flex-shrink: 0; border-radius: 0; }
    .conn-status.ok { background: var(--duo-green-light); color: var(--duo-green-dark); }
    .conn-status.warn { background: #fff3cd; color: #856404; }
    .conn-status.err { background: #ffe5e5; color: var(--duo-red); }

    /* ===== Chat ===== */
    .chat-container {
      flex: 1; overflow-y: auto; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 10px;
      -webkit-overflow-scrolling: touch;
      background: var(--duo-bg);
    }
    .msg { display: flex; gap: 10px; align-items: flex-start; max-width: 82%; }
    .msg.self { align-self: flex-end; flex-direction: row-reverse; }
    .msg.ai { align-self: flex-start; }
    .msg.other { align-self: flex-start; }

    .msg .av {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
      background: #f0f0f0;
      box-shadow: 0 2px 0 #e0e0e0;
    }
    .msg.ai .av {
      background: var(--duo-green-light);
      box-shadow: 0 2px 0 #b8e89c;
      overflow: hidden;
      padding: 2px;
    }
    .msg .body { min-width: 0; }
    .msg .name { font-size: 11px; color: var(--duo-text-light); margin-bottom: 3px; font-weight: 700; }
    .msg.self .name { text-align: right; }
    .msg.ai .name { color: var(--duo-green-dark); }

    .msg .bubble {
      padding: 10px 14px; border-radius: var(--duo-radius);
      font-size: 15px; line-height: 1.5; word-break: break-word;
      white-space: pre-wrap; display: inline-block; position: relative;
    }
    .msg.self .bubble {
      background: var(--duo-blue); color: white;
      border-bottom-right-radius: 6px;
      box-shadow: 0 2px 0 var(--duo-blue-dark);
    }
    .msg.ai .bubble {
      background: var(--duo-card); color: var(--duo-text);
      border: 2px solid var(--duo-green);
      border-bottom-left-radius: 6px;
      box-shadow: 0 2px 0 var(--duo-border);
    }
    .msg.other .bubble {
      background: var(--duo-card); color: var(--duo-text);
      border: 2px solid var(--duo-border);
      border-bottom-left-radius: 6px;
      box-shadow: 0 2px 0 #eee;
    }
    .msg .status { font-size: 10px; color: #aaa; margin-top: 3px; font-weight: 600; }
    .msg.self .status { text-align: right; }
    .msg .status.fail { color: var(--duo-red); cursor: pointer; }
    .msg .mention { background: #e8f4fd; color: var(--duo-blue-dark); padding: 1px 4px; border-radius: 4px; font-weight: 700; }
    .msg .bubble.highlight { animation: glow 2s ease; }
    @keyframes glow { 0%,30% { box-shadow: 0 0 12px rgba(88,204,2,0.4); } 100% { box-shadow: none; } }

    /* System notice */
    .notice {
      text-align: center; font-size: 12px; color: #5a7a96;
      padding: 5px 14px; align-self: center;
      background: #e4f0fa; border-radius: 20px; font-weight: 600;
    }
    .waiting-hint {
      text-align: center; font-size: 13px; color: #7a8b9c;
      padding: 16px; align-self: center;
      display: flex; align-items: center; gap: 8px; justify-content: center;
    }
    .waiting-pulse {
      width: 10px; height: 10px; border-radius: 50%; background: #4a90e2;
      animation: waitPulse 1.5s ease-in-out infinite;
    }
    @keyframes waitPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .time-sep {
      text-align: center; font-size: 11px; color: #a0b4c8;
      padding: 8px 0 4px; letter-spacing: 1px; font-weight: 600;
    }
    .banner {
      border-radius: 12px; padding: 12px 16px;
      text-align: center; font-size: 14px; font-weight: 700;
      align-self: center; margin: 6px 0;
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .banner.warn { background: #fff3cd; border: 2px solid #ffc107; color: #856404; }
    .banner.end { background: #ffe5e5; border: 2px solid var(--duo-red); color: var(--duo-red); }

    /* ===== Input ===== */
    .input-area {
      display: flex; padding: 10px 12px; gap: 8px;
      background: var(--duo-card);
      border-top: 2px solid var(--duo-border);
      align-items: flex-end; flex-shrink: 0;
    }
    .input-area textarea {
      flex: 1; padding: 10px 14px; border-radius: 14px;
      border: 2px solid var(--duo-border); font-size: 15px;
      resize: none; outline: none; max-height: 100px;
      line-height: 1.4; font-family: inherit;
      transition: border-color 0.2s;
    }
    .input-area textarea:focus { border-color: var(--duo-blue); }
    .input-area textarea:disabled { background: #f0f7ff; color: #8ab4d8; }
    .input-area .btn-row { display: flex; gap: 6px; }
    .input-area button {
      width: 40px; height: 40px; border-radius: 50%;
      border: none; cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s;
    }
    .input-area button:active { transform: scale(0.9); }
    .input-area .send-btn {
      background: var(--duo-green); color: white;
      box-shadow: 0 3px 0 var(--duo-green-dark);
      font-weight: 800;
    }
    .input-area .send-btn:disabled { background: #b8d4f0; box-shadow: 0 3px 0 #8fb8dc; color: #fff; opacity: 0.6; }
    .input-area .emoji-btn { background: var(--duo-yellow); box-shadow: 0 3px 0 #d4a800; }
    .input-area .attach-btn { background: #a29bfe; box-shadow: 0 3px 0 #6c5ce7; color: white; font-size: 16px; }

    /* Quick AI action bar */
    .quick-actions {
      display: none; padding: 6px 12px; gap: 6px;
      background: var(--duo-card); border-top: 1px solid var(--duo-border);
      overflow-x: auto; white-space: nowrap; flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .quick-actions::-webkit-scrollbar { display: none; }
    .quick-actions.show { display: flex; }
    .qa-btn {
      flex-shrink: 0; padding: 6px 14px; border-radius: 18px;
      border: 2px solid #d0e8ff; background: #f0f7ff;
      color: var(--duo-green-dark); font-size: 13px; font-weight: 700;
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .qa-btn:active { transform: scale(0.93); background: #d4e6fa; }
    .qa-btn.highlight { background: var(--duo-green-light); border-color: var(--duo-green); }
    .chat-img { max-width: 200px; max-height: 200px; border-radius: 10px; cursor: pointer; display: block; }
    .chat-img:active { opacity: 0.8; }
    .file-bubble {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: #f0f0f0; border-radius: 12px; font-size: 12px; color: #333;
    }
    .file-bubble .file-icon { font-size: 20px; }
    .file-bubble .file-name { font-weight: 600; word-break: break-all; }
    .file-bubble .file-size { color: #999; font-size: 11px; }

    .emoji-panel {
      display: none; position: absolute; bottom: 65px; left: 10px; right: 10px;
      background: var(--duo-card); border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12); padding: 14px;
      max-height: 180px; overflow-y: auto; z-index: 50;
    }
    .emoji-panel.show { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
    .emoji-panel span {
      font-size: 24px; text-align: center; cursor: pointer;
      padding: 6px; border-radius: 10px; transition: background 0.1s;
    }
    .emoji-panel span:active { background: var(--duo-green-light); }

    /* ===== Mention Picker ===== */
    .mention-picker {
      display: none; position: absolute; bottom: 75px; left: 10px; right: 10px;
      background: var(--duo-card); border-radius: 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.18); padding: 6px; z-index: 60;
      max-height: 220px; overflow-y: auto;
    }
    .mention-picker.show { display: block; }
    .mention-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 10px; cursor: pointer;
      transition: background 0.12s;
    }
    .mention-item:hover, .mention-item.active { background: #eaf2fc; }
    .mention-item .m-avatar {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; background: #f4f4f4; overflow: hidden;
    }
    .mention-item .m-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .mention-item .m-name { font-size: 14px; color: var(--duo-text); font-weight: 600; }
    .mention-item .m-tag {
      font-size: 11px; color: #fff; background: var(--duo-green);
      padding: 1px 6px; border-radius: 6px; margin-left: auto;
    }

    /* ===== Overlays ===== */
    .overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;
      z-index: 100; backdrop-filter: blur(4px);
    }
    .card {
      background: var(--duo-card); width: 90%; max-width: 360px;
      border-radius: 20px; padding: 28px 24px; text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }
    .card h2 { margin-bottom: 8px; font-size: 22px; font-weight: 800; }
    .card p { color: var(--duo-text-light); font-size: 14px; margin-bottom: 18px; line-height: 1.6; }
    .card input {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      border: 2px solid var(--duo-border); font-size: 15px;
      margin-bottom: 12px; outline: none; text-align: center;
      transition: border-color 0.2s;
    }
    .card input:focus { border-color: var(--duo-blue); }
    .card .btn-full {
      background: var(--duo-green); border: none; color: white;
      font-weight: 800; padding: 14px; border-radius: 14px;
      font-size: 16px; cursor: pointer; width: 100%;
      box-shadow: 0 4px 0 var(--duo-green-dark);
      transition: transform 0.1s;
    }
    .card .btn-full:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--duo-green-dark); }
    .card .note { margin-top: 12px; font-size: 12px; color: var(--duo-text-light); }
    .card .note a { color: var(--duo-blue); font-weight: 700; text-decoration: none; }

    /* ===== Setup screen ===== */
    .setup-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; padding: 20px; text-align: center;
      overflow-y: auto;
    }
    .setup-screen .mascot { margin-bottom: 12px; animation: slideUp 0.3s ease both; }
    .setup-screen h2 { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .setup-screen .desc { color: var(--duo-text-light); font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
    .setup-screen .room-options { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
    .room-card {
      background: var(--duo-card); border: 2px solid var(--duo-border);
      border-radius: 16px; padding: 16px; text-align: left;
      cursor: pointer; display: flex; gap: 12px; align-items: center;
      box-shadow: 0 4px 0 var(--duo-border);
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease, border-color 0.15s ease;
      animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .room-card:nth-child(1) { animation-delay: 0.1s; }
    .room-card:nth-child(2) { animation-delay: 0.2s; }
    .room-card:hover { border-color: var(--duo-green); box-shadow: 0 4px 0 var(--duo-green); }
    .room-card:active { transform: translateY(4px) scale(0.98); box-shadow: 0 0px 0 var(--duo-green); }
    .room-card .rc-icon { font-size: 28px; flex-shrink: 0; }
    .room-card .rc-info { flex: 1; }
    .room-card .rc-title { font-size: 15px; font-weight: 800; color: var(--duo-text); margin-bottom: 2px; }
    .room-card .rc-desc { font-size: 12px; color: var(--duo-text-light); line-height: 1.4; }
    .setup-screen .divider { font-size: 12px; color: #ccc; margin: 4px 0; }
    .setup-screen .join-section { width: 100%; max-width: 320px; margin-top: 8px; }
    .setup-screen .join-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .setup-screen .join-row input {
      flex: 1; padding: 11px; border-radius: 12px;
      border: 2px solid var(--duo-border); text-align: center;
      font-size: 14px; outline: none;
    }
    .setup-screen .join-row input:focus { border-color: var(--duo-blue); }
    .setup-screen .join-row button {
      padding: 11px 16px; border-radius: 12px;
      background: var(--duo-blue); color: white; border: none;
      font-size: 14px; font-weight: 700; cursor: pointer;
      box-shadow: 0 3px 0 var(--duo-blue-dark);
    }
    .setup-screen .join-row button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--duo-blue-dark); }

    /* ===== Invite panel ===== */
    .invite-panel {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: var(--duo-card); border-radius: 20px 20px 0 0;
      padding: 24px 20px; z-index: 90;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.12);
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.18,0.89,0.32,1.28), visibility 0s 0.3s;
      visibility: hidden;
    }
    .invite-panel.show { transform: translateY(0); visibility: visible; transition: transform 0.3s cubic-bezier(0.18,0.89,0.32,1.28), visibility 0s 0s; }
    .invite-panel h3 { font-size: 18px; font-weight: 800; margin-bottom: 14px; }
    .invite-panel .link-box {
      background: #f5f5f5; padding: 12px; border-radius: 10px;
      font-size: 13px; word-break: break-all; margin-bottom: 14px;
      user-select: all; border: 2px dashed var(--duo-border);
    }
    .invite-panel .btn-copy {
      width: 100%; padding: 14px; background: var(--duo-green);
      color: white; border: none; border-radius: 14px;
      font-size: 16px; font-weight: 800; cursor: pointer;
      box-shadow: 0 4px 0 var(--duo-green-dark);
    }
    .invite-panel .btn-copy:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--duo-green-dark); }
    .invite-panel .close-invite { position: absolute; top: 14px; right: 18px; font-size: 24px; cursor: pointer; color: #ccc; font-weight: 700; }

    /* ===== Dog Avatar SVG ===== */
    .dog-avatar {
      width: 32px; height: 32px;
      border-radius: 8px;
      object-fit: cover;
    }
    .dog-avatar-big {
      width: 120px; height: 120px;
      border-radius: 24px;
      object-fit: cover;
    }
    .hero-sheep {
      width: 180px; height: 180px;
      object-fit: contain;
      display: block;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function resumeAudio() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration, type, vol) {
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(vol || 0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    o.start(); o.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function playJoinSound() {
  // Ascending cheerful ding-ding-ding
  try {
    const t = audioCtx.currentTime;
    [660, 880, 1100].forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(f, t + i * 0.08);
      g.gain.setValueAtTime(0.2, t + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.01, t + i * 0.08 + 0.15);
      o.start(t + i * 0.08); o.stop(t + i * 0.08 + 0.15);
    });
  } catch(e) {}
}

function playSendSound() {
  // Quick pop - short high frequency burst
  playTone(1200, 0.08, 'sine', 0.15);
}

function playReceiveSound() {
  // Soft ding
  playTone(880, 0.12, 'sine', 0.12);
}

function playAIDoneSound() {
  // Duolingo correct answer: two-note ascending chime
  try {
    const t = audioCtx.currentTime;
    const o1 = audioCtx.createOscillator(); const g1 = audioCtx.createGain();
    o1.connect(g1); g1.connect(audioCtx.destination);
    o1.type = 'sine'; o1.frequency.setValueAtTime(880, t);
    g1.gain.setValueAtTime(0.2, t); g1.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
    o1.start(t); o1.stop(t + 0.2);
    const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
    o2.connect(g2); g2.connect(audioCtx.destination);
    o2.type = 'sine'; o2.frequency.setValueAtTime(1320, t + 0.12);
    g2.gain.setValueAtTime(0.25, t + 0.12); g2.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
    o2.start(t + 0.12); o2.stop(t + 0.4);
  } catch(e) {}
}

function playEndSound() {
  // Descending soft tone
  try {
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine'; o.frequency.setValueAtTime(660, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(330, audioCtx.currentTime + 0.4);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    o.start(); o.stop(audioCtx.currentTime + 0.5);
  } catch(e) {}
}

// ========== HEARTBEAT ==========
function startHeartbeat(conn) {
  const id = conn.peer || conn.connectionId;
  const iv = setInterval(() => {
    if (conn.open) conn.send({ type: "ping" });
  }, HEARTBEAT_INTERVAL);

  let lastPong = Date.now();
  const check = setInterval(() => {
    if (Date.now() - lastPong > HEARTBEAT_TIMEOUT) {
      console.log("Heartbeat timeout for", id);
      clearInterval(iv); clearInterval(check);
      heartbeatTimers.delete(id);
      if (conn.open) conn.close();
    }
  }, HEARTBEAT_INTERVAL);

  heartbeatTimers.set(id, { iv, check, updatePong: () => { lastPong = Date.now(); } });
}

function handlePong(conn) {
  const id = conn.peer || conn.connectionId;
  const ht = heartbeatTimers.get(id);
  if (ht) ht.updatePong();
}

function stopHeartbeat(conn) {
  const id = conn.peer || conn.connectionId;
  const ht = heartbeatTimers.get(id);
  if (ht) { clearInterval(ht.iv); clearInterval(ht.check); heartbeatTimers.delete(id); }
}

function initPeer(id, onOpen) {
  peer = new Peer(id, getPeerConfig());

  peer.on("open", (pid) => {
    console.log("Peer open:", pid);
    if (isHost) {
      roomId = pid;
      setConnStatus("房间已创建，等待好友加入~", "ok");
      if (!participants.find(p => p.id === pid)) {
        participants.push({ id: pid, userId: myUserId, name: myName, avatar: myAvatar, online: true });
      }
      updateOnlineBar();
      // 更新URL，让微信分享时自动带上房间号
      history.replaceState(null, '', location.pathname + '?room=' + pid);
      // 友好引导
      displayNotice("点击顶部「+邀请」把房间分享给好友");
    }
    // 访客逻辑通过回调传入，避免重复绑定 peer.on("open")
    if (typeof onOpen === "function") onOpen(pid);
  });

  peer.on("connection", (conn) => {
    if (!isHost) return;
    if (roomEnded) { setTimeout(() => { try { conn.send({ type: "room-ended" }); } catch(e){} }, 300); return; }
    if (connections.length >= MAX_USERS - 1) { setTimeout(() => { try { conn.send({ type: "room-full" }); } catch(e){} }, 300); return; }
    connections.push(conn);
    conn.on("open", () => { startHeartbeat(conn); });
    conn.on("data", (data) => hostHandleData(conn, data));
    conn.on("close", () => hostHandleDisconnect(conn));
    conn.on("error", () => hostHandleDisconnect(conn));
  });

  peer.on("error", (err) => {
    console.error("Peer error:", err.type, err);
    if (err.type === 'peer-unavailable') {
      // 信令服务器确认该peer不存在——房间已结束或不存在
      if (!isHost && !roomEnded) {
        showRoomEnded("这个房间已经结束了", false, "房间不存在或已被关闭<br>你可以创建一个新房间");
      }
    } else if (err.type === 'browser-incompatible') {
      alert("当前浏览器不支持WebRTC，请用Chrome/Safari/微信内置浏览器试试");
    } else if (err.type === 'unavailable-id') {
      if (isHost) {
        const oldPeer = peer;
        roomId = roomId + randomString(2);
        if (oldPeer) { try { oldPeer.destroy(); } catch(e){} }
        peer = null;
        participants = []; // 防止重复 1 号
        initPeer(roomId);
      }
    } else {
      setConnStatus("连接异常(" + (err.type||'unknown') + ")，等待重试...", "warn");
    }
  });

  peer.on("disconnected", () => {
    if (!roomEnded && peer && !peer.destroyed) {
      console.log("Peer disconnected, reconnecting...");
      setTimeout(() => { if (peer && !peer.destroyed) peer.reconnect(); }, 2000);
    }
  });
}

// ========== HOST LOGIC ==========
function hostHandleData(conn, data) {
  if (data.type === "ping") { conn.send({ type: "pong" }); return; }
  if (data.type === "pong") { handlePong(conn); return; }

  if (data.type === "join") {
    const nickname = (data.nickname || "访客").substring(0, 8);
    const userId = data.userId || conn.peer; // 持久身份ID

    // 检查是否是老用户回归（基于持久userId）
    const existing = participants.find(p => p.userId === userId);
    if (existing) {
      // 回归用户：继承原来的名字和头像
      existing.online = true;
      existing.id = conn.peer; // 更新连接peer ID
      const avatar = existing.avatar;
      conn.guestInfo = { name: existing.name, avatar, id: conn.peer, userId };
      updateOnlineBar();

      conn.send({ type: "identity", nickname: existing.name, avatar });
      conn.send({ type: "participants", list: participants });
      conn.send({ type: "ai-mute-state", hasAI: !!hostApiKey });
      syncHistoryTo(conn);

      broadcastParticipants();
      displayNotice(`${avatar} ${existing.name} 回来了`);
    } else {
      // 新用户：先按 conn.peer 去重（防止同连接重复 join）
      const existingById = participants.find(p => p.id === conn.peer);
      if (existingById) {
        existingById.online = true;
        conn.guestInfo = { name: existingById.name, avatar: existingById.avatar, id: conn.peer, userId };
        conn.send({ type: "identity", nickname: existingById.name, avatar: existingById.avatar });
        conn.send({ type: "participants", list: participants });
        conn.send({ type: "ai-mute-state", hasAI: !!hostApiKey });
        syncHistoryTo(conn);
        broadcastParticipants();
        return;
      }
      // 真正的新用户：分配头像和编号名
      const avatar = getNextAvatar();
      const num = participants.length + 1;
      const assignedName = num + "号";
      conn.guestInfo = { name: assignedName, avatar, id: conn.peer, userId };
      participants.push({ id: conn.peer, userId, name: assignedName, avatar, online: true });
      updateOnlineBar();

      conn.send({ type: "identity", nickname: assignedName, avatar });
      conn.send({ type: "participants", list: participants });
      conn.send({ type: "ai-mute-state", hasAI: !!hostApiKey });
      syncHistoryTo(conn);

      broadcastToAll({ type: "user-joined", name: assignedName, avatar, id: conn.peer }, conn);
      broadcastParticipants();
      displayNotice(`${avatar} ${assignedName} 加入了聊天`);
      removeWaitingHint();
      playJoinSound();
      chatStarted = true;

      aiGreetNewUser(assignedName);
    }

  } else if (data.type === "chat-message") {
    const sender = conn.guestInfo?.name || "访客";
    const avatar = conn.guestInfo?.avatar || "👤";
    const mid = data.msgId;

    conn.send({ type: "msg-ack", msgId: mid, status: "ok" });
    broadcastToAll({ type: "chat-message", text: data.text, sender, avatar, msgId: mid }, conn);
    displayMsg("other", data.text, sender, avatar);
    playReceiveSound();

    // 记录到 AI 上下文
    if (hostApiKey) messagesHistory.push({ role: "user", content: `${sender}: ${data.text}` });
    // 只有被 @或自然语言才触发 AI
    if (shouldTriggerAI(data.text)) {
      callAIWithPrompt(`${sender} 叫你呢，你看看上面聊的，回应一下`);
    } else {
      checkSoulMoment(data.text, sender);
    }

  } else if (data.type === "image-message") {
    const sender = conn.guestInfo?.name || "访客";
    const avatar = conn.guestInfo?.avatar || "👤";
    const mid = data.msgId;
    conn.send({ type: "msg-ack", msgId: mid, status: "ok" });
    broadcastToAll({ type: "image-message", image: data.image, sender, avatar }, conn);
    displayImageMsg("other", data.image, sender, avatar);
    if (hostApiKey) messagesHistory.push({ role: "user", content: `${sender}: [发了一张图片]` });

  } else if (data.type === "file-message") {
    const sender = conn.guestInfo?.name || "访客";
    const avatar = conn.guestInfo?.avatar || "👤";
    const mid = data.msgId;
    conn.send({ type: "msg-ack", msgId: mid, status: "ok" });
    broadcastToAll({ type: "file-message", fileName: data.fileName, sizeText: data.sizeText, sender, avatar }, conn);
    displayFileMsg("other", data.fileName, data.sizeText, sender, avatar);
    if (hostApiKey) messagesHistory.push({ role: "user", content: `${sender}: [上传了文件 ${data.fileName}]` });

  } else if (data.type === "request-ai") {
    // 访客请求 AI 回应
    const sender = conn.guestInfo?.name || "访客";
    const intentLabels = {
      judge: "来评理", summarize: "总结",
      analyze: "帮分析", opinion: "接话"
    };
    const label = intentLabels[data.intent] || "来评理";
    // 没有真人聊天内容时不触发 AI
    const hasRealChat = messagesHistory.some(m => m.role === "user");
    if (!hasRealChat) {
      displayNotice("先聊点什么再叫小羊吧~");
      broadcastToAll({ type: "ai-notice", text: "先聊点什么再叫小羊吧~" });
      return;
    }
    displayNotice(`${sender} 点了「${label}」`);
    broadcastToAll({ type: "ai-trigger", name: sender, intent }, conn);

    if (hostApiKey) {
      const prompts = {
        judge: `${sender} 请你评评理，客观公正地说`,
        summarize: `${sender} 请你总结一下刚才聊的内容`,
        analyze: `${sender} 请你分析一下现在的情况`,
        opinion: `${sender} 点了接话，你自然地接上这个话题聊两句`
      };
      callAIWithPrompt(prompts[data.intent] || prompts.judge);
    }

  } else if (data.type === "typing") {
    const name = conn.guestInfo?.name || "访客";
    showTypingIndicator(name);
    broadcastToAll({ type: "typing", name }, conn);
  } else if (data.type === "msg-ack") {
    confirmMsgStatus(data.msgId, data.status);
  } else if (data.type === "request-end") {
    // 被访客结束：房主也属于被结束方
    if (!roomEnded) {
      playEndSound();
      roomEnded = true;
      // 通知其他访客（被动方看"对方和你说白白了"）
      broadcastToAll({ type: "room-end-notice" }, conn);
      // 告诉发起者本人（主动方看"所有记录已清除"）
      conn.send({ type: "room-end-self" });
      clearCache();
      localStorage.removeItem("host_rooms");
      chatBox.innerHTML = "";
      disableInput("已结束");
      document.getElementById("endBtn").classList.add("hidden");
      const overlay = document.getElementById("endedOverlay");
      document.getElementById("endedDesc").innerHTML = "对方和你说白白了<br>下次再聊～";
      document.getElementById("endedRetryBtn").style.display = "none";
      overlay.classList.remove("hidden");
      setTimeout(() => { connections.forEach(c => { try{c.close();}catch(e){} }); connections = []; }, 1000);
    }
  } else if (data.type === "guest-leaving") {
    displayNotice(`${data.name || "访客"}正在离开`);
  }
}

function hostHandleDisconnect(conn) {
  // 防止 close + error 双重触发
  if (conn._handledDisconnect) return;
  conn._handledDisconnect = true;
  connections = connections.filter(c => c !== conn);
  stopHeartbeat(conn);
  if (conn.guestInfo) {
    const p = participants.find(x => x.id === conn.guestInfo.id);
    if (p) {
      p.online = false;
      updateOnlineBar();
      displayNotice(`${conn.guestInfo.avatar} ${conn.guestInfo.name} 离开了`);
      broadcastParticipants();
    }
  }
}

function syncHistoryTo(conn) {
  for (let i = 0; i < messagesHistory.length; i++) {
    const msg = messagesHistory[i];
    if (msg.role === "user") {
      const ci = msg.content.indexOf(": ");
      if (ci > 0) {
        const sender = msg.content.substring(0, ci);
        const text = msg.content.substring(ci + 2);
        const p = participants.find(x => x.name === sender);
        conn.send({ type: "chat-message", text, sender, avatar: p?.avatar || "👤", isHistory: true });
      }
    } else if (msg.role === "assistant") {
      conn.send({ type: "ai-end", fullContent: msg.content, isHistory: true });
    }
  }
}

function broadcastToAll(data, exclude) {
  connections.forEach(c => { if (c !== exclude && c.open) { try { c.send(data); } catch(e){} } });
}
function broadcastParticipants() { broadcastToAll({ type: "participants", list: participants }); }

// ========== EMOJI REACTIONS ==========
const REACT_EMOJIS = { flower: "💐", poop: "💩", happy: "😊", thumbsup: "👍" };
const REACT_TAG_RE = /\[REACT:(flower|poop|happy|thumbsup):([^\]]+)\]/g;

// 解析文本中的反应标签，返回 { reactions: [{type, target}], cleanText }
function parseReactions(text) {
  const reactions = [];
  const cleanText = text.replace(REACT_TAG_RE, (match, type, target) => {
    reactions.push({ type, target: target.trim() });
    return "";
  }).trim();
  return { reactions, cleanText };
}

// 表情飞向头像动画（小到大 + 快到慢 + 拖尾）
function flyEmojiToTarget(emoji, targetName, delay) {
  setTimeout(() => {
    const bar = document.getElementById("onlineBar");
    const tag = bar.querySelector(`.tag[data-name="${targetName}"]`);
    if (!tag) return;
    const rect = tag.getBoundingClientRect();
    const cbRect = document.getElementById("chatBox").getBoundingClientRect();
    const startX = cbRect.left + cbRect.width / 2 - 20;
    const startY = cbRect.bottom - 80;
    const endX = rect.left + rect.width / 2 - 20;
    const endY = rect.top + rect.height / 2 - 20;
    // 抛物线控制点（弧线效果）
    const midX = (startX + endX) / 2;
    const midY = Math.min(startY, endY) - 80;
    // 主表情 + 3个拖尾
    const trails = [
      { delay: 0,   scale: 1,   opacity: 1,   size: 40 },
      { delay: 80,  scale: 0.7, opacity: 0.55, size: 32 },
      { delay: 160, scale: 0.45, opacity: 0.3, size: 24 },
      { delay: 240, scale: 0.25, opacity: 0.15, size: 18 }
    ];
    const duration = 1800;
    // 抛物线路径：用多段 keyframe 模拟弧线
    const steps = 12;
    trails.forEach(trail => {
      const el = document.createElement("span");
      el.className = "fly-emoji";
      el.textContent = emoji;
      el.style.fontSize = trail.size + "px";
      el.style.left = startX + "px";
      el.style.top = startY + "px";
      el.style.opacity = "0";
      document.body.appendChild(el);
      // 生成抛物线 keyframes
      const keyframes = [];
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        // 二次贝塞尔曲线
        const x = (1-t)*(1-t)*startX + 2*(1-t)*t*midX + t*t*endX;
        const y = (1-t)*(1-t)*startY + 2*(1-t)*t*midY + t*t*endY;
        const kf = { left: x+"px", top: y+"px" };
        // 缩放：小→大→保持→微缩
        if (t < 0.15) kf.transform = `scale(${0.2 + t/0.15 * 1.6 * trail.scale}) rotate(${t * -120}deg)`;
        else if (t < 0.7) kf.transform = `scale(${1.8 * trail.scale}) rotate(${(t-0.15) * 30}deg)`;
        else kf.transform = `scale(${(1.8 - (t-0.7)/0.3 * 0.6) * trail.scale}) rotate(${15 + (t-0.7)*20}deg)`;
        // 透明度：淡入→保持→淡出
        if (t < 0.1) kf.opacity = t / 0.1 * trail.opacity;
        else if (t < 0.75) kf.opacity = trail.opacity;
        else kf.opacity = trail.opacity * (1 - (t-0.75)/0.25);
        keyframes.push(kf);
      }
      el.animate(keyframes, {
        duration,
        delay: trail.delay,
        easing: "cubic-bezier(0.15, 0.8, 0.25, 1)", // 快到慢
        fill: "forwards"
      }).onfinish = () => el.remove();
    });
  }, delay || 0);
}

// 表情反应名称映射
const REACT_LABELS = { flower: "💐鲜花", poop: "💩臭臭", happy: "😊开心", thumbsup: "👍点赞" };

// 显示表情反应（飞行动画 + 通知记录）
function showReaction(reactions) {
  if (!reactions || !reactions.length) return;
  let delay = 0;
  reactions.forEach(r => {
    const emoji = REACT_EMOJIS[r.type];
    const label = REACT_LABELS[r.type] || emoji;
    if (!emoji) return;
    if (r.target === "all") {
      displayNotice(`${AI_NAME}给所有人送了${label}`);
      participants.filter(p => p.online).forEach((p, i) => {
        flyEmojiToTarget(emoji, p.name, delay + i * 120);
      });
      delay += participants.length * 120 + 300;
    } else {
      displayNotice(`${AI_NAME}给${r.target}扔了${label}`);
      flyEmojiToTarget(emoji, r.target, delay);
      delay += 500;
    }
  });
}

// 从文本中剥离反应标签（用于流式显示）
function stripReactTags(text) {
  return text.replace(REACT_TAG_RE, "").trim();
}

// ========== TYPING INDICATOR ==========
let lastTypingBroadcast = 0;
let typingTimers = new Map();

function broadcastTyping() {
  const now = Date.now();
  if (now - lastTypingBroadcast < 3000) return;
  lastTypingBroadcast = now;
  if (isHost) {
    broadcastToAll({ type: "typing", name: myName });
  } else {
    if (hostConn?.open) hostConn.send({ type: "typing", name: myName });
  }
}

// 显示某人在打字
function showTypingIndicator(name) {
  const bar = document.getElementById("onlineBar");
  const tag = bar.querySelector(`.tag[data-name="${name}"]`);
  if (!tag || name === myName) return; // 不显示自己
  tag.classList.add("is-typing");
  // 3秒后自动清除
  if (typingTimers.has(name)) clearTimeout(typingTimers.get(name));
  typingTimers.set(name, setTimeout(() => {
    tag.classList.remove("is-typing");
    typingTimers.delete(name);
  }, 3000));
}

// ========== AI TRIGGER (按需触发) ==========

// 检测消息是否应触发 AI（@提及 或 自然语言指令）
function shouldTriggerAI(text) {
  // @提及
  if (/@(小羊|正义的小羊)/.test(text)) return true;
  // 自然语言触发词
  const triggers = [
    /小羊[，,]?你?(来|说说|评评|讲讲|分析|总结|看看|觉得|怎么看|说两句|给个意见)/,
    /你(来|给)(评评|说说|总结|分析|判断|看看)/,
    /大家(来|说说)?(评评|怎么看)/,
    /(评评理|说说看|总结(一下)?|分析分析|给个说法)/,
    /@(小羊|正义的小羊)/
  ];
  return triggers.some(r => r.test(text));
}

// @小羊按钮 - 插入@小羊到输入框并聚焦
function mentionSheep() {
  const input = document.getElementById("userInput");
  const val = input.value;
  // 如果已经有@小羊就不重复插入
  if (val.includes("@小羊")) { input.focus(); return; }
  input.value = (val ? val + " " : "") + "@小羊 ";
  input.focus();
  // 光标定位到末尾
  input.setSelectionRange(input.value.length, input.value.length);
}

// 快捷按钮触发 AI
function askSheep(intent) {
  const intentLabels = {
    judge: "来评理", summarize: "总结",
    analyze: "帮分析", opinion: "接话"
  };
  const label = intentLabels[intent] || "来评理";

  // 访客：直接转发给房主，房主那边做内容检查
  if (!hostApiKey && !isHost) {
    if (hostConn?.open) hostConn.send({ type: "request-ai", intent });
    displayNotice(`${myName} 点了「${label}」`);
    return;
  }

  // 房主：没有真人聊天内容时不触发 AI
  const hasRealChat = messagesHistory.some(m => m.role === "user");
  if (!hasRealChat) {
    displayNotice("先聊点什么再叫小羊吧~");
    return;
  }

  displayNotice(`${myName} 点了「${label}」`);
  if (!hostApiKey || roomEnded) return;

  broadcastToAll({ type: "ai-trigger", name: myName, intent });

  const prompts = {
    judge: "你来评评理，客观公正地说说你的看法",

    analyze: "你帮忙分析一下现在这个情况",

  };

}

// 构建完整上下文并调用 AI
function callAIWithPrompt(explicitPrompt) {
  if (!hostApiKey || roomEnded) return;
  const onlineList = participants.filter(p => p.online).map(p => p.name);
  const isSingle = onlineList.length <= 1;

  // 单人房间用专用 prompt，多人房间用完整 prompt
  const basePrompt = isSingle ? AI_PROMPT_SINGLE : AI_PROMPT;

  const roomCtx = isSingle
    ? `【当前只有${onlineList[0] || myName}一个人，这是1对1私聊。】`
    : `【房间状态】当前在线${onlineList.length}人：${onlineList.join('、')}。只涉及这些人。`;

  const sysContent = roomCtx + '\n\n' + basePrompt;
  const ctx = [
    { role: "system", content: sysContent },
    ...messagesHistory
  ];
  if (explicitPrompt) {
    ctx.push({ role: "user", content: explicitPrompt });
  }
  _callAIDirect(ctx, null);
}

// 直接调用 DeepSeek API（流式）
async function _callAIDirect(messagesToSend, userVisibleText) {
  if (roomEnded) return;
  // 记录到历史（用简短可见文本，不存完整prompt）
  if (userVisibleText) {
    messagesHistory.push({ role: "user", content: userVisibleText });
  }

  const aiDiv = displayMsg("ai", "", AI_NAME, "🐑");
  const aiText = aiDiv.querySelector(".ai-text");
  if (aiText) { aiText.innerHTML = '<span class="ai-thinking"><span class="thinking-text">小羊在想</span><span class="typing-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></span>'; }
  broadcastToAll({ type: "ai-loading" });

  const ctrl = new AbortController();
  const timeout = setTimeout(() => ctrl.abort(), 60000);

  try {
    const resp = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${hostApiKey}` },
      body: JSON.stringify({ model: MODEL, messages: messagesToSend, stream: true }),
      signal: ctrl.signal
    });
    clearTimeout(timeout);
    if (!resp.ok) throw new Error(`API ${resp.status}`);

    const reader = resp.body.getReader(), decoder = new TextDecoder();
    let full = "";
    if (aiText) { aiText.innerHTML = ""; }
    broadcastToAll({ type: "ai-start" });

    while (true) {
      if (roomEnded) { reader.cancel(); break; }
      const { done, value } = await reader.read();
      if (done) break;
      for (const line of decoder.decode(value, { stream: true }).split("\n")) {
        if (!line.startsWith("data: ")) continue;
        const ds = line.slice(6).trim();
        if (ds === "[DONE]") continue;
        try {
          const delta = JSON.parse(ds).choices?.[0]?.delta?.content;
          if (delta) { full += delta; if (aiText) aiText.textContent = full.includes('[REACT:') ? stripReactTags(full) : full; chatBox.scrollTop = chatBox.scrollHeight; broadcastToAll({ type: "ai-delta", content: delta }); }
        } catch(e) {}
      }
    }

    if (roomEnded) return;
    if (full) {
      // 解析反应标签并触发动画
      const { reactions, cleanText } = parseReactions(full);
      if (reactions.length) {
        showReaction(reactions);
        broadcastToAll({ type: "ai-react", reactions });
        // 等表情飞完再更新文本（动画 1800ms + 拖尾 240ms + 余量）
        await new Promise(r => setTimeout(r, 2500));
      }
      if (aiText) aiText.textContent = cleanText || stripReactTags(full);
      messagesHistory.push({ role: "assistant", content: cleanText || stripReactTags(full) });
      trimHistory();
      broadcastToAll({ type: "ai-end", fullContent: cleanText || stripReactTags(full) });
      playAIDoneSound();
    }
    else { if (aiText) aiText.textContent = "（打了个哈欠）"; }
    saveCache();
  } catch(e) {
    clearTimeout(timeout);
    if (roomEnded) return;
    const msg = e.name === 'AbortError' ? '请求超时（60s）' : e.message;
    if (aiText) { aiText.innerHTML = ""; aiText.textContent = "出错了：" + msg; aiText.style.color = "var(--duo-red)"; }
    broadcastToAll({ type: "ai-error", error: msg });
  }
}

async function aiGreetNewUser(nickname) {
  if (!hostApiKey || roomEnded) return;
  const onlineList = participants.filter(p => p.online).map(p => p.name);
  const roomCtx = `【房间状态】当前在线${onlineList.length}人：${onlineList.join('、')}。只涉及这些人。`;
  const sysPrompt = roomCtx + '\n\n' + AI_PROMPT;
  const prompt = `新朋友「${nickname}」刚加入聊天，简短打个招呼欢迎一下，一句话就行。`;
  try {
    const resp = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${hostApiKey}` },
      body: JSON.stringify({ model: MODEL, messages: [{ role: "system", content: sysPrompt }, ...messagesHistory, { role: "user", content: prompt }], max_tokens: 60 })
    });
    if (!resp.ok) return;
    const data = await resp.json();
    if (roomEnded) return; // 房间已结束，丢弃响应
    const reply = data.choices?.[0]?.message?.content?.trim();
    if (reply) {
      displayMsg("ai", reply, AI_NAME, "🐑");
      messagesHistory.push({ role: "assistant", content: reply });
      trimHistory();
      broadcastToAll({ type: "ai-end", fullContent: reply });
      saveCache();
    }
  } catch(e) {}
}

// ========== GUEST LOGIC ==========
function guestHandleData(data) {
  if (data.type === "ping") { hostConn.send({ type: "pong" }); return; }
  if (data.type === "pong") { handlePong(hostConn); return; }

  switch(data.type) {
    case "room-ended": showEnded(); break;
    case "room-full": alert("房间满了（最多10人）~"); backToSetup(); break;
    case "typing": showTypingIndicator(data.name); break;
    case "identity":
      myName = data.nickname;
      myAvatar = data.avatar;
      // 持久化身份，下次进入同房间时继承
      localStorage.setItem("chat_user_name", myName);
      localStorage.setItem("chat_user_avatar", myAvatar);
      document.getElementById("endBtn").classList.remove("hidden");
      break;
    case "participants": participants = data.list; updateOnlineBar(); break;
    case "user-joined":
      if (!participants.find(p => p.id === data.id)) participants.push({ id: data.id, name: data.name, avatar: data.avatar, online: true });
      updateOnlineBar();
      if (!data.isHistory) { displayNotice(`${data.avatar} ${data.name} 加入了聊天`); playJoinSound(); }
      break;
    case "ai-mute-state":
      hasAIRoom = data.hasAI !== false;
      if (hasAIRoom) {
        document.getElementById("headerSheep").style.display = "";
        document.querySelector(".header .title").textContent = "小羊群聊";
        document.title = "AI 群聊室";
        document.getElementById("quickActions").classList.add("show");
      } else {
        document.getElementById("headerSheep").style.display = "none";
        document.querySelector(".header .title").textContent = "群聊房间";
        document.title = "群聊室";
        document.getElementById("quickActions").classList.remove("show");
      }
      break;
    case "chat-message":
      displayMsg("other", data.text, data.sender, data.avatar);
      if (!data.isHistory) playReceiveSound();
      saveCache();
      break;
    case "image-message":
      displayImageMsg("other", data.image, data.sender, data.avatar);
      saveCache();
      break;
    case "file-message":
      displayFileMsg("other", data.fileName, data.sizeText, data.sender, data.avatar);
      saveCache();
      break;
    case "ai-trigger": {
      const intentLabels = { judge: "来评理", summarize: "总结", analyze: "帮分析", opinion: "接话" };
      const label = intentLabels[data.intent] || "来评理";
      displayNotice(`${data.name} 点了「${label}」`);
      break;
    }
    case "ai-notice":
      displayNotice(data.text);
      break;
    case "ai-react": {
      showReaction(data.reactions);
      break;
    }
    case "ai-loading": {
      const ld = displayMsg("ai", "", AI_NAME, "🐑");
      ld.classList.add("ai-streaming");
      const ldText = ld.querySelector(".ai-text");
      if (ldText) ldText.innerHTML = '<span class="typing-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';
      break;
    }
    case "ai-start": {
      const streaming = chatBox.querySelector(".msg.ai.ai-streaming");
      if (streaming) { const t = streaming.querySelector(".ai-text"); if(t) { t.innerHTML = ""; t.dataset.raw = ""; } }
      break;
    }
    case "ai-delta": {
      const streaming = chatBox.querySelector(".msg.ai.ai-streaming");
      if (streaming) {
        const t = streaming.querySelector(".ai-text");
        if (t) { t.dataset.raw = (t.dataset.raw || "") + data.content; const raw = t.dataset.raw; t.textContent = raw.includes('[REACT:') ? stripReactTags(raw) : raw; }
      }
      chatBox.scrollTop = chatBox.scrollHeight;
      break;
    }
    case "ai-end": {
      const streaming = chatBox.querySelector(".msg.ai.ai-streaming");
      if (streaming) {
        const t = streaming.querySelector(".ai-text");
        if(t) t.textContent = data.fullContent;
        streaming.classList.remove("ai-streaming");
      } else {
        // 没收到loading/delta，直接显示完整消息
        displayMsg("ai", data.fullContent, AI_NAME, "🐑");
      }
      playAIDoneSound();
      saveCache();
      break;
    }
    case "ai-error":
      displayMsg("ai", "出错了：" + data.error, AI_NAME, "🐑");
      break;
    case "msg-ack":
      confirmMsgStatus(data.msgId, data.status);
      break;
    case "host-leaving":
      displayNotice("房主正在离开…");
      break;
    case "room-end-notice":
      if (!roomEnded) showEnded();
      break;
    case "room-end-self": {
      // 自己发起的结束（可能本地已处理，防重复）
      if (roomEnded) break;
      roomEnded = true;
      clearCache();
      chatBox.innerHTML = "";
      playEndSound();
      const selfOverlay = document.getElementById("endedOverlay");
      document.getElementById("endedDesc").innerHTML = "所有记录已清除<br>下次再聊~";
      document.getElementById("endedRetryBtn").style.display = "none";
      selfOverlay.classList.remove("hidden");
      document.getElementById("endedSheep").style.display = hasAIRoom ? "block" : "none";
      disableInput("已结束");
      break;
    }
  }
  saveCacheDebounced();
}

// ========== RECONNECT (GUEST) ==========
function guestReconnect() {
  if (roomEnded || isReconnecting) return;
  if (reconnectCount >= 8) {
    showRoomEnded("房主已离开，房间已结束", false, "连接多次失败，房主可能已关闭页面<br>你可以创建一个新房间");
    return;
  }
  isReconnecting = true;
  reconnectCount++;
  const delay = Math.min(2000 * reconnectCount, 10000); // 递增间隔，最大10秒
  if (reconnectCount >= 5) {
    setConnStatus("重连失败，房主可能已离开", "err");
    disableInput("房主可能已离开");
  } else {
    setConnStatus(`连接断开，重连中(${reconnectCount})…`, "warn");
    disableInput("正在重连…");
  }

  setTimeout(() => {
    if (roomEnded || !peer || peer.destroyed) { isReconnecting = false; return; }
    try {
      hostConn = peer.connect(roomId, { reliable: true });
      const conn = hostConn;
      let settled = false;
      conn.on("open", () => {
        if (settled) return;
        settled = true;
        isReconnecting = false;
        reconnectCount = 0;
        setConnStatus("连接成功！", "ok");
        enableInput();
        startHeartbeat(conn);
        conn.on("data", guestHandleData);
        conn.on("close", guestDisconnected);
        conn.on("error", guestDisconnected);
        conn.send({ type: "join", nickname: myName || "新访客", userId: myUserId });
      });
      conn.on("error", () => {
        if (settled) return;
        settled = true;
        isReconnecting = false;
        if (!roomEnded) guestReconnect();
      });
      // 单次超时保护（不叠加）
      setTimeout(() => {
        if (!settled && !roomEnded) {
          settled = true;
          isReconnecting = false;
          try { conn.close(); } catch(e){}
          guestReconnect();
        }
      }, 10000);
    } catch(e) {
      isReconnecting = false;
      guestReconnect();
    }
  }, delay);
}

function guestDisconnected() {
  if (roomEnded || isReconnecting) return;
  setConnStatus("连接断开了，正在重连…", "err");
  disableInput("正在重连…");
  displayNotice("连接断开，正在尝试重连");
  if (hostConn) { stopHeartbeat(hostConn); hostConn = null; }
  guestReconnect();
}

function handleKey(e) {
  // Mention picker 优先处理上下/回车/Tab/Esc
  if (mentionState.open) {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveMentionActive(1); return; }
    if (e.key === 'ArrowUp')   { e.preventDefault(); moveMentionActive(-1); return; }
    if (e.key === 'Enter' || e.key === 'Tab') {
      e.preventDefault();
      const items = currentMentionList();
      if (items.length) selectMention(items[mentionState.activeIdx] || items[0]);
      return;
    }
    if (e.key === 'Escape') { e.preventDefault(); closeMentionPicker(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMyMessage(); }
}

// ========== @ Mention Picker ==========
const mentionState = { open: false, startIdx: -1, query: "", activeIdx: 0 };

function detectMentionTrigger() {
  const v = userInput.value;
  const cursor = userInput.selectionStart;
  // 向左找最近的 @
  let at = -1;
  for (let i = cursor - 1; i >= 0; i--) {
    const ch = v[i];
    if (ch === '@') { at = i; break; }
    if (ch === ' ' || ch === '\n') break;
  }
  if (at < 0) { closeMentionPicker(); return; }
  // @ 前必须是行首/空格/换行
  const prev = at === 0 ? '' : v[at - 1];
  if (prev && prev !== ' ' && prev !== '\n') { closeMentionPicker(); return; }
  const q = v.substring(at + 1, cursor);
  if (q.includes(' ') || q.includes('\n')) { closeMentionPicker(); return; }
  mentionState.open = true;
  mentionState.startIdx = at;
  mentionState.query = q;
  mentionState.activeIdx = 0;
  renderMentionPicker();
}

function currentMentionList() {
  const q = (mentionState.query || "").toLowerCase();
  const list = [];
  // AI 优先（仅 AI 房间）
  if (hostApiKey) list.push({ name: AI_NAME, avatar: "🐑", isAI: true });
  // 所有在线参与者（不含自己）
  participants.forEach(p => {
    if (!p.online) return;
    if (p.name === myName) return; // 自己排除
    list.push({ name: p.name, avatar: p.avatar, isAI: false });
  });
  if (!q) return list;
  return list.filter(it => it.name.toLowerCase().includes(q));
}

function renderMentionPicker() {
  const picker = document.getElementById("mentionPicker");
  const items = currentMentionList();
  if (!items.length) { closeMentionPicker(); return; }
  if (mentionState.activeIdx >= items.length) mentionState.activeIdx = 0;
  picker.innerHTML = items.map((it, i) => {
    const av = it.isAI
      ? `<img src="sheep-avatar-96.png" alt="${it.name}">`
      : (it.avatar || "👤");
    const tag = it.isAI ? '<span class="m-tag">AI</span>' : '';
    return `<div class="mention-item ${i === mentionState.activeIdx ? 'active' : ''}" data-idx="${i}">
      <span class="m-avatar">${av}</span>
      <span class="m-name">${it.name}</span>
      ${tag}
    </div>`;
  }).join('');
  picker.classList.add('show');
  // 点击选择
  picker.querySelectorAll('.mention-item').forEach(el => {
    el.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const idx = parseInt(el.dataset.idx);
      selectMention(items[idx]);
    });
  });
}

function moveMentionActive(delta) {
  const items = currentMentionList();
  if (!items.length) return;
  mentionState.activeIdx = (mentionState.activeIdx + delta + items.length) % items.length;
  renderMentionPicker();
}

function selectMention(item) {
  if (!item) return;
  const v = userInput.value;
  const start = mentionState.startIdx;
  const cursor = userInput.selectionStart;
  const before = v.substring(0, start);
  const after = v.substring(cursor);
  const insert = '@' + item.name + ' ';
  userInput.value = before + insert + after;
  const newPos = before.length + insert.length;
  userInput.setSelectionRange(newPos, newPos);
  closeMentionPicker();
  userInput.focus();
}

function closeMentionPicker() {
  mentionState.open = false;
  mentionState.startIdx = -1;
  mentionState.query = "";
  const picker = document.getElementById("mentionPicker");
  if (picker) { picker.classList.remove('show'); picker.innerHTML = ''; }
}

function randomString(n) { return Math.random().toString(36).substring(2, 2+n); }

// ========== FEEDBACK ==========
const EMAILJS_SERVICE = "service_ki7c1mf";
const EMAILJS_TEMPLATE = "template_5ve5e5t";
const EMAILJS_PUBLIC = "zcENl8KXKgTSew4jK";
let feedbackImages = [];
let emailjsReady = false;

function initEmailJS() {
  if (emailjsReady) return Promise.resolve();
  return new Promise((resolve) => {
    if (typeof emailjs !== "undefined") {
      try { emailjs.init({ publicKey: EMAILJS_PUBLIC }); emailjsReady = true; } catch(e) {}
      resolve(); return;
    }
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js";
    s.onload = () => {
      try { emailjs.init({ publicKey: EMAILJS_PUBLIC }); emailjsReady = true; } catch(e) { console.warn("EmailJS init failed:", e); }
      resolve();
    };
    s.onerror = () => { console.warn("EmailJS script load failed"); resolve(); };
    document.head.appendChild(s);
  });
}

function openFeedback() {
  initEmailJS(); // 每次打开时确保初始化
  document.getElementById("feedbackOverlay").classList.remove("hidden");
  document.getElementById("feedbackText").value = "";
  feedbackImages = [];
  document.getElementById("feedbackPreview").innerHTML = "";
  document.getElementById("feedbackImgCount").textContent = "";
  document.getElementById("feedbackSendBtn").textContent = "发送";
  document.getElementById("feedbackSendBtn").disabled = false;
}

function closeFeedback() {
  document.getElementById("feedbackOverlay").classList.add("hidden");
}

function previewFeedbackImg(input) {
  const files = Array.from(input.files);
  if (feedbackImages.length + files.length > 3) {
    alert("最多添加 3 张图片");
    input.value = "";
    return;
  }
  files.forEach(file => {
    if (feedbackImages.length >= 3) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      feedbackImages.push(e.target.result);
      renderFeedbackPreview();
    };
    reader.readAsDataURL(file);
  });
  input.value = "";
}

function renderFeedbackPreview() {
  const preview = document.getElementById("feedbackPreview");
  preview.innerHTML = feedbackImages.map((src, i) =>
    `<img src="${src}" onclick="removeFeedbackImg(${i})" style="cursor:pointer" title="点击移除">`
  ).join("");
  document.getElementById("feedbackImgCount").textContent =
    feedbackImages.length ? `${feedbackImages.length}/3` : "";
}

function removeFeedbackImg(idx) {
  feedbackImages.splice(idx, 1);
  renderFeedbackPreview();
}

function compressImage(base64Src, maxWidth, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => resolve(base64Src);
    img.src = base64Src;
  });
}

async function uploadToImgbb(base64Data) {
  const IMGBB_KEY = "6fdf6e5a55b91104782f658c30b89bd3";
  // 去掉 data:image/xxx;base64, 前缀
  const base64Clean = base64Data.split(",")[1] || base64Data;
  const resp = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: "image=" + encodeURIComponent(base64Clean)
  });
  const data = await resp.json();
  if (data.success) return data.data.display_url;
  return null;
}

async function sendFeedback() {
  const text = document.getElementById("feedbackText").value.trim();
  if (!text && feedbackImages.length === 0) {
    alert("请输入反馈内容或添加图片");
    return;
  }

  const btn = document.getElementById("feedbackSendBtn");
  btn.textContent = "发送中…";
  btn.disabled = true;

  try {
    if (typeof emailjs === "undefined") {
      alert("反馈服务暂不可用，请稍后重试");
      btn.textContent = "发送";
      btn.disabled = false;
      return;
    }

    const sendParams = {
      message: text || "（仅图片反馈）",
      room_id: roomId || "unknown",
      user_name: myName || "unknown",
      timestamp: new Date().toLocaleString("zh-CN"),
      image_count: feedbackImages.length
    };

    // 压缩图片 → 上传到 imgbb → 邮件里发图片链接
    for (let i = 0; i < feedbackImages.length && i < 3; i++) {
      btn.textContent = `上传图片 ${i + 1}/${feedbackImages.length}…`;
      const compressed = await compressImage(feedbackImages[i], 500, 0.5);
      const url = await uploadToImgbb(compressed);
      if (url) sendParams[`image_${i + 1}`] = url;
    }

    btn.textContent = "发送邮件…";
    await emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, sendParams);
    btn.textContent = "已发送 ✓";
    setTimeout(closeFeedback, 1200);
  } catch(e) {
    btn.textContent = "发送失败，点重试";
    btn.disabled = false;
    console.error("Feedback error:", e?.text || e?.message || e);
  }
}

window.addEventListener("beforeunload", () => {
  if (roomEnded) { clearCache(); return; }
  // 房主离开时广播警告，给访客缓冲
  if (isHost && connections.length > 0) {
    try {
      broadcastToAll({ type: "host-leaving" });
      // 短暂延迟确保消息发出（beforeunload 中同步发送）
      const xhr = new XMLHttpRequest();
      xhr.open("GET", "", false); // 同步请求阻塞页面关闭一小段时间
    } catch(e) {}
  }
  // 访客离开时通知房主
  if (!isHost && hostConn?.open) {
    try { hostConn.send({ type: "guest-leaving", name: myName }); } catch(e) {}
  }
  clearCache();
});
