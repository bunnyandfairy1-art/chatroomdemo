<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AI 群聊室</title>
  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <style>
    :root {
      --duo-green: #58cc02;
      --duo-green-dark: #46a302;
      --duo-green-light: #d7ffb8;
      --duo-blue: #1cb0f6;
      --duo-blue-dark: #1899d6;
      --duo-purple: #ce82ff;
      --duo-orange: #ff9600;
      --duo-red: #ff4b4b;
      --duo-yellow: #ffc800;
      --duo-bg: #f7f7f7;
      --duo-card: #ffffff;
      --duo-text: #3c3c3c;
      --duo-text-light: #777;
      --duo-border: #e5e5e5;
      --duo-shadow: 0 2px 0 #e5e5e5;
      --duo-radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Nunito", "Segoe UI", sans-serif;
      background: var(--duo-bg);
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      color: var(--duo-text);
    }
    .hidden { display: none !important; }

    /* ===== Header ===== */
    .header {
      background: var(--duo-card);
      padding: 12px 16px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 2px solid var(--duo-border);
      flex-shrink: 0;
    }
    .header .dog-mini { width: 32px; height: 32px; }
    .header .title { flex: 1; font-size: 17px; font-weight: 800; color: var(--duo-text); }
    .header .badge {
      font-size: 12px; font-weight: 700;
      background: var(--duo-green-light); color: var(--duo-green-dark);
      padding: 5px 12px; border-radius: 20px; cursor: pointer;
      border: none; transition: transform 0.1s;
    }
    .header .badge:active { transform: scale(0.95); }
    .header .btn-sm {
      font-size: 12px; font-weight: 700;
      background: #eef; color: var(--duo-purple);
      border: none; padding: 5px 12px; border-radius: 20px; cursor: pointer;
    }
    .header .btn-sm:active { transform: scale(0.95); }
    .header .btn-danger { background: #ffe5e5; color: var(--duo-red); }

    /* ===== Online bar ===== */
    .online-bar {
      background: var(--duo-card);
      padding: 8px 14px;
      font-size: 12px; color: var(--duo-text-light);
      border-bottom: 1px solid var(--duo-border);
      display: flex; align-items: center; gap: 6px;
      flex-wrap: wrap; flex-shrink: 0;
      overflow: hidden; max-height: 60px;
    }
    .online-bar .tag {
      display: inline-flex; align-items: center; gap: 3px;
      background: #f0f0f0; padding: 3px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
    }
    .online-bar .tag.offline { opacity: 0.4; }
    .online-bar .dot { width: 7px; height: 7px; border-radius: 50%; }
    .online-bar .dot.on { background: var(--duo-green); }
    .online-bar .dot.off { background: #ddd; }

    /* ===== Connection status ===== */
    .conn-status { text-align: center; padding: 6px; font-size: 12px; font-weight: 700; flex-shrink: 0; border-radius: 0; }
    .conn-status.ok { background: var(--duo-green-light); color: var(--duo-green-dark); }
    .conn-status.warn { background: #fff3cd; color: #856404; }
    .conn-status.err { background: #ffe5e5; color: var(--duo-red); }

    /* ===== Chat ===== */
    .chat-container {
      flex: 1; overflow-y: auto; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 10px;
      -webkit-overflow-scrolling: touch;
      background: var(--duo-bg);
    }
    .msg { display: flex; gap: 10px; align-items: flex-start; max-width: 82%; animation: popIn 0.25s cubic-bezier(0.18,0.89,0.32,1.28); }
    .msg.self { align-self: flex-end; flex-direction: row-reverse; }
    .msg.ai { align-self: flex-start; }
    .msg.other { align-self: flex-start; }

    .msg .av {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
      background: #f0f0f0;
      box-shadow: 0 2px 0 #e0e0e0;
    }
    .msg.ai .av {
      background: var(--duo-green-light);
      box-shadow: 0 2px 0 #b8e89c;
      overflow: hidden;
      padding: 2px;
    }
    .msg .body { min-width: 0; }
    .msg .name { font-size: 11px; color: var(--duo-text-light); margin-bottom: 3px; font-weight: 700; }
    .msg.self .name { text-align: right; }
    .msg.ai .name { color: var(--duo-green-dark); }

    .msg .bubble {
      padding: 10px 14px; border-radius: var(--duo-radius);
      font-size: 15px; line-height: 1.5; word-break: break-word;
      white-space: pre-wrap; display: inline-block; position: relative;
    }
    .msg.self .bubble {
      background: var(--duo-blue); color: white;
      border-bottom-right-radius: 6px;
      box-shadow: 0 2px 0 var(--duo-blue-dark);
    }
    .msg.ai .bubble {
      background: var(--duo-card); color: var(--duo-text);
      border: 2px solid var(--duo-green);
      border-bottom-left-radius: 6px;
      box-shadow: 0 2px 0 var(--duo-border);
    }
    .msg.other .bubble {
      background: var(--duo-card); color: var(--duo-text);
      border: 2px solid var(--duo-border);
      border-bottom-left-radius: 6px;
      box-shadow: 0 2px 0 #eee;
    }
    .msg .status { font-size: 10px; color: #aaa; margin-top: 3px; font-weight: 600; }
    .msg.self .status { text-align: right; }
    .msg .status.fail { color: var(--duo-red); cursor: pointer; }
    .msg .mention { background: #e8f4fd; color: var(--duo-blue-dark); padding: 1px 4px; border-radius: 4px; font-weight: 700; }
    .msg .bubble.highlight { animation: glow 2s ease; }
    @keyframes glow { 0%,30% { box-shadow: 0 0 12px rgba(88,204,2,0.4); } 100% { box-shadow: none; } }

    /* System notice */
    .notice {
      text-align: center; font-size: 12px; color: var(--duo-text-light);
      padding: 4px 12px; align-self: center;
      background: #f0f0f0; border-radius: 20px; font-weight: 600;
    }
    .banner {
      border-radius: 12px; padding: 12px 16px;
      text-align: center; font-size: 14px; font-weight: 700;
      align-self: center; margin: 6px 0;
    }
    .banner.warn { background: #fff3cd; border: 2px solid #ffc107; color: #856404; }
    .banner.end { background: #ffe5e5; border: 2px solid var(--duo-red); color: var(--duo-red); }

    /* ===== Input ===== */
    .input-area {
      display: flex; padding: 10px 12px; gap: 8px;
      background: var(--duo-card);
      border-top: 2px solid var(--duo-border);
      align-items: flex-end; flex-shrink: 0;
    }
    .input-area textarea {
      flex: 1; padding: 10px 14px; border-radius: 14px;
      border: 2px solid var(--duo-border); font-size: 15px;
      resize: none; outline: none; max-height: 100px;
      line-height: 1.4; font-family: inherit;
      transition: border-color 0.2s;
    }
    .input-area textarea:focus { border-color: var(--duo-blue); }
    .input-area textarea:disabled { background: #f7f7f7; }
    .input-area .btn-row { display: flex; gap: 6px; }
    .input-area button {
      width: 40px; height: 40px; border-radius: 50%;
      border: none; cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s;
    }
    .input-area button:active { transform: scale(0.9); }
    .input-area .send-btn {
      background: var(--duo-green); color: white;
      box-shadow: 0 3px 0 var(--duo-green-dark);
      font-weight: 800;
    }
    .input-area .send-btn:disabled { background: #e5e5e5; box-shadow: 0 3px 0 #ccc; color: #aaa; }
    .input-area .emoji-btn { background: var(--duo-yellow); box-shadow: 0 3px 0 #d4a800; }
    .input-area .mic-btn { background: #ff6b6b; box-shadow: 0 3px 0 #d63031; color: white; font-size: 16px; }
    .input-area .mic-btn.recording { animation: mic-pulse 0.8s infinite; }
    @keyframes mic-pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
    .voice-recording-hint {
      position: absolute; top: -44px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: white; padding: 6px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 600; white-space: nowrap; pointer-events: none;
    }
    .voice-msg {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: #f0f0f0; border-radius: 12px; cursor: pointer; min-width: 120px;
      touch-action: manipulation; user-select: none;
    }
    .voice-msg.playing .voice-icon { animation: voice-wave 1s infinite; }
    @keyframes voice-wave { 0%{opacity:1} 50%{opacity:0.3} 100%{opacity:1} }
    .voice-msg .voice-icon { font-size: 16px; }
    .voice-msg .voice-dur { font-size: 12px; color: #666; }
    .voice-transcript { font-size: 13px; color: #555; margin-top: 4px; line-height: 1.4; word-break: break-all; }
    .msg.self .voice-transcript { color: rgba(255,255,255,0.85); }
    .input-area .attach-btn { background: #a29bfe; box-shadow: 0 3px 0 #6c5ce7; color: white; font-size: 16px; }
    .chat-img { max-width: 200px; max-height: 200px; border-radius: 10px; cursor: pointer; display: block; }
    .chat-img:active { opacity: 0.8; }
    .file-bubble {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: #f0f0f0; border-radius: 12px; font-size: 12px; color: #333;
    }
    .file-bubble .file-icon { font-size: 20px; }
    .file-bubble .file-name { font-weight: 600; word-break: break-all; }
    .file-bubble .file-size { color: #999; font-size: 11px; }

    .emoji-panel {
      display: none; position: absolute; bottom: 65px; left: 10px; right: 10px;
      background: var(--duo-card); border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12); padding: 14px;
      max-height: 180px; overflow-y: auto; z-index: 50;
    }
    .emoji-panel.show { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
    .emoji-panel span {
      font-size: 24px; text-align: center; cursor: pointer;
      padding: 6px; border-radius: 10px; transition: background 0.1s;
    }
    .emoji-panel span:active { background: var(--duo-green-light); }

    /* ===== Overlays ===== */
    .overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;
      z-index: 100; backdrop-filter: blur(4px);
    }
    .card {
      background: var(--duo-card); width: 90%; max-width: 360px;
      border-radius: 20px; padding: 28px 24px; text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }
    .card h2 { margin-bottom: 8px; font-size: 22px; font-weight: 800; }
    .card p { color: var(--duo-text-light); font-size: 14px; margin-bottom: 18px; line-height: 1.6; }
    .card input {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      border: 2px solid var(--duo-border); font-size: 15px;
      margin-bottom: 12px; outline: none; text-align: center;
      transition: border-color 0.2s;
    }
    .card input:focus { border-color: var(--duo-blue); }
    .card .btn-full {
      background: var(--duo-green); border: none; color: white;
      font-weight: 800; padding: 14px; border-radius: 14px;
      font-size: 16px; cursor: pointer; width: 100%;
      box-shadow: 0 4px 0 var(--duo-green-dark);
      transition: transform 0.1s;
    }
    .card .btn-full:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--duo-green-dark); }
    .card .note { margin-top: 12px; font-size: 12px; color: var(--duo-text-light); }
    .card .note a { color: var(--duo-blue); font-weight: 700; text-decoration: none; }

    /* Mode selector grid */
    .mode-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
      margin-bottom: 12px; text-align: left;
    }
    .mode-card {
      padding: 10px; border-radius: 12px; cursor: pointer;
      border: 2px solid var(--duo-border); transition: all 0.2s;
      display: flex; flex-direction: column; gap: 2px;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none;
    }
    .mode-card:active { transform: scale(0.97); }
    .mode-card.selected { border-color: var(--duo-green); background: var(--duo-green-light); }
    .mode-card .mode-icon, .mode-card .mode-name, .mode-card .mode-desc { pointer-events: none; }
    .mode-card .mode-icon { font-size: 16px; }
    .mode-card .mode-name { font-size: 12px; font-weight: 800; color: var(--duo-text); }
    .mode-card .mode-desc { font-size: 10px; color: var(--duo-text-light); line-height: 1.3; }
    .mode-card-empty {
      grid-column: span 2; padding: 10px; border-radius: 12px; cursor: pointer;
      border: 2px dashed var(--duo-border); transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none;
    }
    .mode-card-empty:active { transform: scale(0.97); }
    .mode-card-empty.selected { border-color: var(--duo-green); background: var(--duo-green-light); border-style: solid; }
    .mode-card-empty .mode-icon, .mode-card-empty .mode-name, .mode-card-empty .mode-desc { pointer-events: none; }
    .mode-card-empty .mode-icon { font-size: 16px; }
    .mode-card-empty .mode-name { font-size: 12px; font-weight: 800; color: var(--duo-text); }
    .mode-card-empty .mode-desc { font-size: 11px; color: var(--duo-text-light); }

    /* ===== Setup screen ===== */
    .setup-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; padding: 24px; text-align: center;
    }
    .setup-screen .mascot { margin-bottom: 16px; }
    .setup-screen h2 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .setup-screen .desc { color: var(--duo-text-light); font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
    .setup-screen .actions { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 300px; }
    .setup-screen .btn-big {
      padding: 14px 30px; border-radius: 14px; font-size: 17px;
      border: none; cursor: pointer; font-weight: 800;
      box-shadow: 0 4px 0 var(--duo-green-dark);
      transition: transform 0.1s;
    }
    .setup-screen .btn-big:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--duo-green-dark); }
    .setup-screen .btn-create { background: var(--duo-green); color: white; }
    .setup-screen .join-row { display: flex; gap: 8px; }
    .setup-screen .join-row input {
      flex: 1; padding: 12px; border-radius: 12px;
      border: 2px solid var(--duo-border); text-align: center;
      font-size: 15px; outline: none;
    }
    .setup-screen .join-row input:focus { border-color: var(--duo-blue); }
    .setup-screen .join-row button {
      padding: 12px 20px; border-radius: 12px;
      background: var(--duo-blue); color: white; border: none;
      font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 3px 0 var(--duo-blue-dark);
    }
    .setup-screen .join-row button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--duo-blue-dark); }

    /* ===== Invite panel ===== */
    .invite-panel {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: var(--duo-card); border-radius: 20px 20px 0 0;
      padding: 24px 20px; z-index: 90;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.12);
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.18,0.89,0.32,1.28), visibility 0s 0.3s;
      visibility: hidden;
    }
    .invite-panel.show { transform: translateY(0); visibility: visible; transition: transform 0.3s cubic-bezier(0.18,0.89,0.32,1.28), visibility 0s 0s; }
    .invite-panel h3 { font-size: 18px; font-weight: 800; margin-bottom: 14px; }
    .invite-panel .link-box {
      background: #f5f5f5; padding: 12px; border-radius: 10px;
      font-size: 13px; word-break: break-all; margin-bottom: 14px;
      user-select: all; border: 2px dashed var(--duo-border);
    }
    .invite-panel .btn-copy {
      width: 100%; padding: 14px; background: var(--duo-green);
      color: white; border: none; border-radius: 14px;
      font-size: 16px; font-weight: 800; cursor: pointer;
      box-shadow: 0 4px 0 var(--duo-green-dark);
    }
    .invite-panel .btn-copy:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--duo-green-dark); }
    .invite-panel .close-invite { position: absolute; top: 14px; right: 18px; font-size: 24px; cursor: pointer; color: #ccc; font-weight: 700; }

    /* ===== Dog Avatar SVG ===== */
    .dog-avatar {
      width: 32px; height: 32px;
    }
    .dog-avatar-big {
      width: 100px; height: 100px;
    }
    .dog-bounce {
      animation: dogBounce 2s ease-in-out infinite;
    }
    @keyframes dogBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .dog-wave {
      animation: dogWave 1.5s ease-in-out infinite;
      transform-origin: 70% 80%;
    }
    @keyframes dogWave {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(15deg); }
      75% { transform: rotate(-5deg); }
    }
    .dog-blink .eye {
      animation: blink 3s ease infinite;
    }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    .dog-tail {
      animation: wag 0.4s ease-in-out infinite alternate;
      transform-origin: 20% 90%;
    }
    @keyframes wag { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }

    .typing-dots::after {
      content: '...';
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media(min-width:500px) {
      body { align-items: center; justify-content: center; background: #e8e8e8; }
      #app { max-width: 420px; width: 100%; height: 100vh; border-radius: 20px; overflow: hidden; border: 2px solid var(--duo-border); box-shadow: 0 8px 30px rgba(0,0,0,0.1); position: relative; }
    }
  </style>
</head>
<body>
<div id="app" style="display:flex;flex-direction:column;height:100%;background:var(--duo-bg);position:relative;overflow:hidden;">

  <!-- Header -->
  <div class="header hidden" id="headerBar">
    <svg class="dog-mini dog-bounce" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="52" r="38" fill="#f5d38a"/>
      <ellipse cx="32" cy="28" rx="12" ry="16" fill="#d4883c" transform="rotate(-15 32 28)"/>
      <ellipse cx="68" cy="28" rx="12" ry="16" fill="#d4883c" transform="rotate(15 68 28)"/>
      <circle cx="50" cy="56" r="30" fill="#fae0a5"/>
      <ellipse cx="50" cy="68" rx="14" ry="10" fill="#fff"/>
      <ellipse cx="50" cy="64" rx="6" ry="4" fill="#3c3c3c"/>
      <circle cx="39" cy="50" r="4" fill="#3c3c3c"/>
      <circle cx="61" cy="50" r="4" fill="#3c3c3c"/>
      <circle cx="40" cy="49" r="1.5" fill="#fff"/>
      <circle cx="62" cy="49" r="1.5" fill="#fff"/>
      <path d="M42 72 Q50 78 58 72" stroke="#d4883c" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>
    <span class="title">小柴和朋友们</span>
    <span class="badge" onclick="toggleInvite()">+邀请</span>
    <button class="btn-sm" id="muteBtn" onclick="toggleMute()">🔊</button>
    <button class="btn-sm btn-danger hidden" id="endBtn" onclick="endRoom()">结束</button>
  </div>

  <!-- Online bar -->
  <div class="online-bar hidden" id="onlineBar"></div>

  <!-- Connection status -->
  <div class="conn-status hidden" id="connStatus"></div>

  <!-- Chat -->
  <div class="chat-container" id="chatBox"></div>

  <!-- Emoji panel -->
  <div class="emoji-panel" id="emojiPanel"></div>

  <!-- Input -->
  <div class="input-area hidden" id="inputArea">
    <button class="emoji-btn" onclick="toggleEmoji()">😊</button>
    <textarea id="userInput" rows="1" placeholder="说点什么吧~ @小柴 可以提问" onkeydown="handleKey(event)"></textarea>
    <div class="btn-row">
      <button class="attach-btn" onclick="document.getElementById('fileInput').click()">+</button>
      <button class="mic-btn" id="micBtn" ontouchstart="startVoice(event)" ontouchend="stopVoice(event)" onmousedown="startVoice(event)" onmouseup="stopVoice(event)" onmouseleave="cancelVoice()">🔈</button>
      <button class="send-btn" id="sendBtn" onclick="sendMyMessage()">↑</button>
    </div>
    <input type="file" id="fileInput" accept="image/*,.txt,.md,.json,.csv,.pdf,.doc,.docx" style="display:none" onchange="handleFileSelect(event)">
  </div>

  <!-- Setup -->
  <div class="setup-screen" id="setupScreen">
    <div class="mascot">
      <svg class="dog-avatar-big dog-bounce dog-blink" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="52" r="42" fill="#f5d38a"/>
        <ellipse cx="28" cy="24" rx="14" ry="18" fill="#d4883c" transform="rotate(-15 28 24)"/>
        <ellipse cx="72" cy="24" rx="14" ry="18" fill="#d4883c" transform="rotate(15 72 24)"/>

<script>
// ========== CONFIG ==========
const API_URL = "https://api.deepseek.com/v1/chat/completions";
const MODEL = "deepseek-chat";
const MAX_USERS = 10;
const HEARTBEAT_INTERVAL = 5000;
const HEARTBEAT_TIMEOUT = 18000;
const AI_DEBOUNCE_MS = 800;
const EMOJIS = ['😊','😂','🤣','😍','🥰','😘','😜','🤔','😎','🥳','😭','😱','🤯','🙄','😴','🤝','👍','👎','❤️','🔥','💯','🎉','👏','💪','🙏','✨','🌟','💡','🐶','🐕','🦴','🐾'];
const ANIMALS = ['🐱','🐶','🐰','🦊','🐼','🐨','🐯','🦁','🐸','🐧'];

// ========== MODE CONFIG ==========
const MODES = {
  casual: {
    name: "小柴",
    title: "闲聊陪伴",
    prompt: `你是"小柴"，一只活泼可爱的AI柴犬群友。规则：
1. 简短口语化中文，每条不超50字，偶尔用颜文字或"汪"。
2. 性格开朗热情，爱凑热闹，像个爱social的小狗。
3. 中立自然语气，但比普通AI更活泼俏皮。
4. 看到所有人发言，有记忆，引用上下文时自然带出。
5. 直接回答提问；闲聊时积极参与但精炼。
6. 偶尔用狗狗相关的比喻（摇尾巴、闻一闻、汪汪等）。`
  },
  mediate: {
    name: "小柴·调停",
    title: "关系调停",
    prompt: `你是"小柴·调停"，一只冷静理性的AI柴犬调解员。规则：
1. 简短口语化中文，每条不超80字。
2. 严格中立，不偏袒任何一方。
3. 核心技能：情绪识别、观点翻译（帮A理解B的真实意思）、逻辑纠偏。
4. 当双方情绪激动时，先安抚情绪再回到问题本身。
5. 常用句式："我理解你的感受..."、"对方想表达的可能是..."、"你们的共同点其实是..."
6. 发现双方有共识时及时点出，推动和解。
7. 保持温暖但不失专业，偶尔加"汪"缓和气氛。`
  },
  decide: {
    name: "小柴·决策",
    title: "群体决策",
    prompt: `你是"小柴·决策"，一只善于分析的AI柴犬参谋。规则：
1. 简短口语化中文，每条不超80字。
2. 核心技能：列出选项、分析利弊、推动收敛。
3. 有人提出新选项时帮忙补充考虑维度。
4. 当讨论发散太远时提醒聚焦。
5. 常用句式："目前有几个选项..."、"这个方案的优势是...但要注意..."、"看起来大家倾向于..."
6. 最终帮忙整理投票或共识，推动做出决定。
7. 保持中立不替人做决定，只提供分析框架。`
  },
  brainstorm: {
    name: "小柴·灵感",
    title: "头脑风暴",
    prompt: `你是"小柴·灵感"，一只脑洞大开的AI柴犬创意伙伴。规则：
1. 简短口语化中文，每条不超60字。
2. 核心技能：发散联想、追问深挖、归类整理。
3. 鼓励任何想法，不评判好坏，先记录再筛选。
4. 擅长"如果...会怎样"的联想跳跃。
5. 常用句式："这个想法可以延伸..."、"还有没有更野一点的..."、"我来归类一下目前的点子..."
6. 定期帮大家整理已有想法，分类归纳。
7. 热情洋溢，像团队里最有创意的那个人，偶尔加"汪~灵感来了！"`
  },
  debate: {
    name: "小柴·裁判",
    title: "辩论对决",
    prompt: `你是"小柴·裁判"，一只严谨公正的AI柴犬辩论裁判。规则：
1. 简短口语化中文，每条不超80字。
2. 核心技能：评估论据强度、指出逻辑漏洞、跟踪比分。
3. 对每个论点评价是否有理有据。
4. 发现逻辑谬误（稻草人、滑坡、诉诸权威等）要指出。
5. 常用句式："这个论据很有力..."、"但这里有个逻辑问题..."、"目前双方各自的强项是..."
6. 最终给出综合评价和胜负判定（可以平局）。
7. 严肃但不刻板，偶尔加"汪，精彩！"表达欣赏。`
  },
  meeting: {
    name: "小柴·记录",
    title: "会议纪要",
    prompt: `你是"小柴·记录"，一只高效专注的AI柴犬记录员。规则：
1. 简短口语化中文，每条不超60字。
2. 核心技能：实时提炼要点、标记待办、生成纪要。
3. 少说多记，不打断讨论节奏。
4. 每隔5-6条消息主动整理一次"当前要点"。
5. 常用句式："记下了：..."、"这是一个待办项..."、"目前讨论的要点是..."
6. 有人跑题时温柔提醒回到主题。
7. 会议结束时自动输出完整纪要摘要。偶尔加"汪，记好了！"`
  },
  empty: {
    name: "",
    title: "空房间",
    noAI: true,
    prompt: ""
  }
};
let currentMode = "casual";

const DOG_SVG_SMALL = `<svg class="dog-avatar dog-bounce" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="52" r="38" fill="#f5d38a"/>
  <ellipse cx="32" cy="28" rx="12" ry="16" fill="#d4883c" transform="rotate(-15 32 28)"/>

  <circle cx="50" cy="56" r="30" fill="#fae0a5"/>
  <ellipse cx="50" cy="68" rx="14" ry="10" fill="#fff"/>
  <ellipse cx="50" cy="64" rx="6" ry="4" fill="#3c3c3c"/>
  <circle cx="39" cy="50" r="4" fill="#3c3c3c"/>
  <circle cx="61" cy="50" r="4" fill="#3c3c3c"/>
  <circle cx="40" cy="49" r="1.5" fill="#fff"/>
  <circle cx="62" cy="49" r="1.5" fill="#fff"/>
  <path d="M42 72 Q50 78 58 72" stroke="#d4883c" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>`;

// ========== STATE ==========
let peer = null, connections = [], hostConn = null;
let isHost = false, roomId = null, roomEnded = false, roomPassword = "";
let myName = "", myAvatar = "", hostApiKey = null;
let aiMuted = false, avatarIdx = 0, inviteAutoShown = false, chatStarted = false;
let participants = [];
let msgQueue = [];
let msgIdCounter = 0;
let heartbeatTimers = new Map();
let reconnectCount = 0, maxReconnect = 5;
let aiDebounceTimer = null, pendingAiText = "";
let messagesHistory = [{
  role: "system",
  content: MODES.casual.prompt
}];

// ========== AUDIO ==========
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function resumeAudio() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('click', resumeAudio, { once: true });
document.addEventListener('touchstart', resumeAudio, { once: true });

function playJoinSound() {
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine'; o.frequency.setValueAtTime(660, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(990, audioCtx.currentTime + 0.08);
    o.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.16);
    g.gain.setValueAtTime(0.25, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
    o.start(); o.stop(audioCtx.currentTime + 0.35);
  } catch(e) {}
}

// ========== SESSION STORAGE ==========
function saveCache() {
  if (roomEnded) return;
  try {
    const data = { roomId, messages: chatBox.innerHTML, participants, myName, myAvatar, isHost };
    sessionStorage.setItem('chatcache_' + roomId, JSON.stringify(data));
  } catch(e) {}
}
function loadCache(rid) {
  try {
    const raw = sessionStorage.getItem('chatcache_' + rid);
    if (raw) { const d = JSON.parse(raw); chatBox.innerHTML = d.messages || ''; return d; }
  } catch(e) {}
  return null;
}
function clearCache() {
  try { Object.keys(sessionStorage).filter(k => k.startsWith('chatcache_')).forEach(k => sessionStorage.removeItem(k)); } catch(e) {}
}

// ========== UI HELPERS ==========
const chatBox = document.getElementById("chatBox");
const userInput = document.getElementById("userInput");

function displayMsg(type, text, name, avatar, msgId) {
  const div = document.createElement("div");
  div.className = `msg ${type}`;
  if (msgId) div.dataset.msgId = msgId;
  const nm = name || (type==='ai'? MODES[currentMode].name:'');
  const processedText = processAtMentions(escapeHtml(text));

  if (type === 'self') {
    div.innerHTML = `<div class="av">${myAvatar}</div><div class="body"><div class="name">${escapeHtml(myName)}</div><div class="bubble">${processedText}</div><div class="status" data-mid="${msgId||''}">发送中</div></div>`;
  } else if (type === 'ai') {
    div.innerHTML = `<div class="av">${DOG_SVG_SMALL}</div><div class="body"><div class="name">${nm}</div><div class="bubble"><span class="ai-text">${processedText}</span></div></div>`;
  } else {
    const av = avatar || '👤';
    div.innerHTML = `<div class="av">${av}</div><div class="body"><div class="name">${escapeHtml(nm)}</div><div class="bubble">${processedText}</div></div>`;
  }
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  saveCache();
  return div;
}

function processAtMentions(html) {
  return html.replace(/@(小柴|[\u4e00-\u9fa5a-zA-Z0-9_]+)/g, '<span class="mention">@$1</span>');
}

function confirmMsgStatus(msgId, status) {
  const el = chatBox.querySelector(`[data-mid="${msgId}"]`);
  if (el) {
    if (status === 'ok') el.textContent = '✓';
    else if (status === 'fail') { el.textContent = '发送失败 · 重试'; el.className = 'status fail'; }
  }
}

function displayNotice(text) {
  const div = document.createElement("div");
  div.className = "notice";
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function showBanner(text, type) {
  const div = document.createElement("div");
  div.className = `banner ${type}`;
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function escapeHtml(t) { return t ? t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }

function setConnStatus(text, level) {
  const el = document.getElementById("connStatus");
  el.textContent = text; el.className = `conn-status ${level}`; el.classList.remove("hidden");
  if (level === 'ok') setTimeout(() => el.classList.add("hidden"), 3000);
}

function updateOnlineBar() {
  const bar = document.getElementById("onlineBar");
  if (participants.length === 0) { bar.classList.add("hidden"); return; }
  bar.classList.remove("hidden");
  bar.innerHTML = participants.map(p =>
    `<span class="tag ${p.online?'':'offline'}"><span class="dot ${p.online?'on':'off'}"></span>${p.avatar} ${p.name}</span>`
  ).join('');
}

function disableInput(msg) {
  userInput.disabled = true; userInput.placeholder = msg || '';
  document.getElementById("sendBtn").disabled = true;
}
function enableInput() {
  userInput.disabled = false;
  const mode = MODES[currentMode];
  userInput.placeholder = mode.noAI ? "说点什么吧~" : `说点什么吧~ @${mode.name} 可以提问`;
  document.getElementById("sendBtn").disabled = false;
}

function getNextAvatar() { return ANIMALS[avatarIdx++ % ANIMALS.length]; }

// Emoji panel
function toggleEmoji() {
  const panel = document.getElementById("emojiPanel");
  if (panel.classList.contains("show")) { panel.classList.remove("show"); return; }
  panel.innerHTML = EMOJIS.map(e => `<span onclick="insertEmoji('${e}')">${e}</span>`).join('');
  panel.classList.add("show");
}
function insertEmoji(e) {
  userInput.value += e;
  document.getElementById("emojiPanel").classList.remove("show");
  userInput.focus();
}

// Invite panel
function toggleInvite(auto) {
  const panel = document.getElementById("invitePanel");
  if (panel.classList.contains("show")) { panel.classList.remove("show"); return; }
  // 如果是自动弹出，检查是否已经在聊天中或已经弹过
  if (auto && (chatStarted || inviteAutoShown)) return;
  if (auto) inviteAutoShown = true;
  document.getElementById("inviteRoomId").textContent = roomId || '';
  panel.classList.add("show");
}
function copyRoomId() {
  const rid = roomId || '';
  if (navigator.clipboard) {
    navigator.clipboard.writeText(rid).then(() => {
      alert("房间号已复制！\n\n发给好友，对方输入即可加入~\n或点右上角「···」直接转发本页面更方便哦");
    }).catch(() => prompt("复制房间号：", rid));
  } else { prompt("复制房间号：", rid); }
  toggleInvite();
}
function copyInvite() {
  const link = getShareLink();
  if (navigator.clipboard) {
    navigator.clipboard.writeText(link).then(() => alert("已复制！发给好友即可加入~")).catch(() => prompt("复制链接：", link));
  } else { prompt("复制链接：", link); }
  toggleInvite();
}

// AI mute
function toggleMute() {
  if (MODES[currentMode].noAI) return;
  aiMuted = !aiMuted;
  document.getElementById("muteBtn").textContent = aiMuted ? '🔇' : '🔊';
  if (isHost) broadcastToAll({ type: "ai-mute-state", muted: aiMuted });
  displayNotice(aiMuted ? `${MODES[currentMode].name}去睡觉了 💤` : `${MODES[currentMode].name}回来了 🐕`);
}

// Mode selection
function selectMode(el) {
  if (!el || !el.getAttribute('data-mode')) {
    el = el.closest('.mode-card, .mode-card-empty');
    if (!el) return;
  }
  document.querySelectorAll('.mode-card, .mode-card-empty').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  currentMode = el.getAttribute('data-mode');
  // 空房间模式隐藏API Key输入框
  const apiInput = document.getElementById("createApiKey");
  const apiNote = apiInput.parentElement.querySelector('.note');
  if (MODES[currentMode].noAI) {
    apiInput.style.display = "none";
    if (apiNote) apiNote.style.display = "none";
  } else {
    apiInput.style.display = "";
    if (apiNote) apiNote.style.display = "";
  }
}

function getShareLink() {
  return roomId ? (location.origin + location.pathname + '?room=' + roomId) : '';
}

// ========== HEARTBEAT ==========
function startHeartbeat(conn) {
  const id = conn.peer || conn.connectionId;
  const iv = setInterval(() => {
    if (conn.open) conn.send({ type: "ping" });
  }, HEARTBEAT_INTERVAL);

  let lastPong = Date.now();
  const check = setInterval(() => {
    if (Date.now() - lastPong > HEARTBEAT_TIMEOUT) {
      console.log("Heartbeat timeout for", id);
      clearInterval(iv); clearInterval(check);
      heartbeatTimers.delete(id);
      if (conn.open) conn.close();
    }
  }, HEARTBEAT_INTERVAL);

  heartbeatTimers.set(id, { iv, check, updatePong: () => { lastPong = Date.now(); } });
}

function handlePong(conn) {
  const id = conn.peer || conn.connectionId;
  const ht = heartbeatTimers.get(id);
  if (ht) ht.updatePong();
}

function stopHeartbeat(conn) {
  const id = conn.peer || conn.connectionId;
  const ht = heartbeatTimers.get(id);
  if (ht) { clearInterval(ht.iv); clearInterval(ht.check); heartbeatTimers.delete(id); }
}

// ========== PEER SETUP ==========
function getPeerConfig() {
  return {
    debug: 0,
    config: { iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun.cloudflare.com:3478" },
      { urls: "stun:stun.miwifi.com:3478" },
      { urls: "turn:freeturn.net:3478", username: "free", credential: "free" },
      { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" }
    ]}
  };
}

function initPeer(id) {
  peer = new Peer(id, getPeerConfig());

  peer.on("open", (pid) => {
    console.log("Peer open:", pid);
    if (isHost) {
      roomId = pid;
      setConnStatus("房间已创建，等待好友加入~", "ok");
      if (!participants.find(p => p.id === pid)) {
        participants.push({ id: pid, name: myName, avatar: myAvatar, online: true });
      }
      updateOnlineBar();
      // 更新URL，让微信分享时自动带上房间号
      history.replaceState(null, '', location.pathname + '?room=' + pid);
    }
  });

  peer.on("connection", (conn) => {
    if (!isHost) return;
    if (roomEnded) { setTimeout(() => { try { conn.send({ type: "room-ended" }); } catch(e){} }, 300); return; }
    if (connections.length >= MAX_USERS - 1) { setTimeout(() => { try { conn.send({ type: "room-full" }); } catch(e){} }, 300); return; }
    connections.push(conn);
    conn.on("open", () => { startHeartbeat(conn); });
    conn.on("data", (data) => hostHandleData(conn, data));
    conn.on("close", () => hostHandleDisconnect(conn));
    conn.on("error", () => hostHandleDisconnect(conn));
  });

  peer.on("error", (err) => {
    console.error("Peer error:", err);
    if (err.type === 'peer-unavailable') {
      setConnStatus("房间不存在或房主已离线", "err");
    }
  });

  peer.on("disconnected", () => {
    if (!roomEnded && peer && !peer.destroyed) {
      setConnStatus("连接断开，正在重连...", "warn");
      setTimeout(() => { if (peer && !peer.destroyed) peer.reconnect(); }, 2000);
    }
  });
}

// ========== HOST LOGIC ==========
function hostHandleData(conn, data) {
  if (data.type === "ping") { conn.send({ type: "pong" }); return; }
  if (data.type === "pong") { handlePong(conn); return; }

  if (data.type === "join") {
    const nickname = (data.nickname || "访客").substring(0, 8);

    // 检查是否是老用户重连
    const existing = participants.find(p => p.id === conn.peer);
    if (existing) {
      // 重连：恢复原来的名字和头像，不当新人处理
      existing.online = true;
      const avatar = existing.avatar;
      conn.guestInfo = { name: existing.name, avatar, id: conn.peer };
      updateOnlineBar();

      conn.send({ type: "identity", nickname: existing.name, avatar });
      conn.send({ type: "participants", list: participants });
      conn.send({ type: "ai-mute-state", muted: aiMuted });
      conn.send({ type: "mode-info", mode: currentMode, modeName: MODES[currentMode].name, modeTitle: MODES[currentMode].title });
      syncHistoryTo(conn);

      broadcastParticipants();
      displayNotice(`${avatar} ${existing.name} 回来了`);
    } else {
      // 新用户：分配头像和名字
      const avatar = getNextAvatar();
      conn.guestInfo = { name: nickname, avatar, id: conn.peer };
      participants.push({ id: conn.peer, name: nickname, avatar, online: true });
      updateOnlineBar();

      conn.send({ type: "identity", nickname, avatar });
      conn.send({ type: "participants", list: participants });
      conn.send({ type: "ai-mute-state", muted: aiMuted });
      conn.send({ type: "mode-info", mode: currentMode, modeName: MODES[currentMode].name, modeTitle: MODES[currentMode].title });
      syncHistoryTo(conn);

      broadcastToAll({ type: "user-joined", name: nickname, avatar, id: conn.peer }, conn);
      broadcastParticipants();
      displayNotice(`${avatar} ${nickname} 加入了聊天`);
      playJoinSound();
      chatStarted = true;

      if (!aiMuted) aiGreetNewUser(nickname);
    }

  } else if (data.type === "chat-message") {
    const sender = conn.guestInfo?.name || "访客";
    const avatar = conn.guestInfo?.avatar || "👤";
    const mid = data.msgId;

    conn.send({ type: "msg-ack", msgId: mid, status: "ok" });
    broadcastToAll({ type: "chat-message", text: data.text, sender, avatar, msgId: mid }, conn);
    displayMsg("other", data.text, sender, avatar);

    if (!aiMuted) triggerAIDebounced(`${sender}: ${data.text}`);

  } else if (data.type === "voice-message") {
    const sender = conn.guestInfo?.name || "访客";
    const avatar = conn.guestInfo?.avatar || "👤";
    const mid = data.msgId;
    const transcript = data.transcript || "";
    conn.send({ type: "msg-ack", msgId: mid, status: "ok" });
    broadcastToAll({ type: "voice-message", audio: data.audio, duration: data.duration, sender, avatar, transcript }, conn);
    displayVoiceMsg("other", data.audio, data.duration, sender, avatar, null, transcript);
    if (!aiMuted && transcript) triggerAIDebounced(`${sender}(语音): ${transcript}`);

  } else if (data.type === "image-message") {
    const sender = conn.guestInfo?.name || "访客";
    const avatar = conn.guestInfo?.avatar || "👤";
    const mid = data.msgId;
    conn.send({ type: "msg-ack", msgId: mid, status: "ok" });
    broadcastToAll({ type: "image-message", image: data.image, sender, avatar }, conn);
    displayImageMsg("other", data.image, sender, avatar);
    if (!aiMuted && !MODES[currentMode].noAI) triggerAIDebounced(`${sender}: [发了一张图片]`);

  } else if (data.type === "file-message") {
    const sender = conn.guestInfo?.name || "访客";
    const avatar = conn.guestInfo?.avatar || "👤";
    const mid = data.msgId;
    conn.send({ type: "msg-ack", msgId: mid, status: "ok" });
    broadcastToAll({ type: "file-message", fileName: data.fileName, sizeText: data.sizeText, sender, avatar }, conn);
    displayFileMsg("other", data.fileName, data.sizeText, sender, avatar);
    if (!aiMuted && !MODES[currentMode].noAI && data.fileData) {
      try {
        const textContent = atob(data.fileData.split(',')[1]);
        const preview = textContent.substring(0, 2000);
        triggerAIDebounced(`${sender}: [上传了文件 ${data.fileName}，内容如下]\n${preview}`);
      } catch(e) {
        triggerAIDebounced(`${sender}: [上传了文件 ${data.fileName}]`);
      }
    }

  } else if (data.type === "msg-ack") {
    confirmMsgStatus(data.msgId, data.status);
  } else if (data.type === "request-end") {
    // 任何人都可以结束房间
    if (!roomEnded) {
      roomEnded = true;
      broadcastToAll({ type: "room-end-notice" });
      clearCache();
      localStorage.removeItem("host_rooms");
      disableInput("已结束");
      document.getElementById("endBtn").classList.add("hidden");
      showBanner("聊天结束啦~ 记录已清除", "end");
      setTimeout(() => { connections.forEach(c => { try{c.close();}catch(e){} }); connections = []; }, 1000);
    }
  }
}

function hostHandleDisconnect(conn) {
  connections = connections.filter(c => c !== conn);
  stopHeartbeat(conn);
  if (conn.guestInfo) {
    const p = participants.find(x => x.id === conn.guestInfo.id);
    if (p) p.online = false;
    updateOnlineBar();
    displayNotice(`${conn.guestInfo.avatar} ${conn.guestInfo.name} 离开了`);
    broadcastParticipants();
  }
}

function syncHistoryTo(conn) {
  for (let i = 1; i < messagesHistory.length; i++) {
    const msg = messagesHistory[i];
    if (msg.role === "user") {
      const ci = msg.content.indexOf(": ");
      if (ci > 0) {
        const sender = msg.content.substring(0, ci);
        const text = msg.content.substring(ci + 2);
        const p = participants.find(x => x.name === sender);
        conn.send({ type: "chat-message", text, sender, avatar: p?.avatar || "👤", isHistory: true });
      }
    } else if (msg.role === "assistant") {
      conn.send({ type: "ai-end", fullContent: msg.content, isHistory: true });
    }
  }
}

function broadcastToAll(data, exclude) {
  connections.forEach(c => { if (c !== exclude && c.open) { try { c.send(data); } catch(e){} } });
}
function broadcastParticipants() { broadcastToAll({ type: "participants", list: participants }); }

// AI debounce
function triggerAIDebounced(text) {
  pendingAiText += "\n" + text;
  clearTimeout(aiDebounceTimer);
  aiDebounceTimer = setTimeout(() => {
    const combined = pendingAiText.trim();
    pendingAiText = "";
    if (combined) callAI(combined);
  }, AI_DEBOUNCE_MS);
}

async function callAI(userText) {
  if (!hostApiKey || roomEnded || aiMuted || MODES[currentMode].noAI) return;
  messagesHistory.push({ role: "user", content: userText });

  const aiDiv = displayMsg("ai", "思考中", MODES[currentMode].name, "🐕");
  const aiText = aiDiv.querySelector(".ai-text");
  if (aiText) aiText.classList.add("typing-dots");
  broadcastToAll({ type: "ai-loading" });

  try {
    const resp = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${hostApiKey}` },
      body: JSON.stringify({ model: MODEL, messages: messagesHistory, stream: true })
    });
    if (!resp.ok) throw new Error(`API ${resp.status}`);

    const reader = resp.body.getReader(), decoder = new TextDecoder();
    let full = "";
    if (aiText) { aiText.textContent = ""; aiText.classList.remove("typing-dots"); }
    broadcastToAll({ type: "ai-start" });

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      for (const line of decoder.decode(value, { stream: true }).split("\n")) {
        if (!line.startsWith("data: ")) continue;
        const ds = line.slice(6).trim();
        if (ds === "[DONE]") continue;
        try {
          const delta = JSON.parse(ds).choices?.[0]?.delta?.content;
          if (delta) { full += delta; if (aiText) aiText.textContent = full; chatBox.scrollTop = chatBox.scrollHeight; broadcastToAll({ type: "ai-delta", content: delta }); }
        } catch(e) {}
      }
    }

    if (full) { messagesHistory.push({ role: "assistant", content: full }); broadcastToAll({ type: "ai-end", fullContent: full }); }
    else { if (aiText) aiText.textContent = "（打了个哈欠）"; }
    saveCache();
  } catch(e) {
    if (aiText) { aiText.classList.remove("typing-dots"); aiText.textContent = "汪...出错了：" + e.message; aiText.style.color = "var(--duo-red)"; }
    broadcastToAll({ type: "ai-error", error: e.message });
  }
}

async function aiGreetNewUser(nickname) {
  if (!hostApiKey || roomEnded || MODES[currentMode].noAI) return;
  const mode = MODES[currentMode];
  const prompt = `新朋友「${nickname}」刚加入群聊。用你${mode.name}的风格简短打个招呼欢迎对方。25字以内，自然口语，可以带个颜文字或"汪"。`;
  try {
    const resp = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${hostApiKey}` },
      body: JSON.stringify({ model: MODEL, messages: [...messagesHistory, { role: "user", content: prompt }], max_tokens: 60 })
    });
    if (!resp.ok) return;
    const data = await resp.json();
    const reply = data.choices?.[0]?.message?.content?.trim();
    if (reply) {
      displayMsg("ai", reply, mode.name, "🐕");
      messagesHistory.push({ role: "assistant", content: reply });
      broadcastToAll({ type: "ai-end", fullContent: reply });
      saveCache();
    }
  } catch(e) {}
}

// ========== GUEST LOGIC ==========
function guestHandleData(data) {
  if (data.type === "ping") { hostConn.send({ type: "pong" }); return; }
  if (data.type === "pong") { handlePong(hostConn); return; }

  switch(data.type) {
    case "room-ended": showEnded(); break;
    case "room-full": alert("房间满了（最多10人）~"); location.reload(); break;
    case "identity": myName = data.nickname; myAvatar = data.avatar; document.getElementById("endBtn").classList.remove("hidden"); break;
    case "participants": participants = data.list; updateOnlineBar(); break;
    case "user-joined":
      if (!participants.find(p => p.id === data.id)) participants.push({ id: data.id, name: data.name, avatar: data.avatar, online: true });
      updateOnlineBar();
      if (!data.isHistory) { displayNotice(`${data.avatar} ${data.name} 加入了聊天`); playJoinSound(); }
      break;
    case "ai-mute-state":
      aiMuted = data.muted;
      document.getElementById("muteBtn").textContent = aiMuted ? '🔇' : '🔊';
      break;
    case "mode-info":
      currentMode = data.mode;
      if (MODES[currentMode].noAI) {
        document.querySelector(".header .title").textContent = "空房间";
        document.getElementById("muteBtn").classList.add("hidden");
      } else {
        document.querySelector(".header .title").textContent = `${data.modeName} · ${data.modeTitle}`;
        document.getElementById("muteBtn").classList.remove("hidden");
      }
      enableInput();
      break;
    case "chat-message":
      displayMsg("other", data.text, data.sender, data.avatar);
      break;
    case "voice-message":
      displayVoiceMsg("other", data.audio, data.duration, data.sender, data.avatar, null, data.transcript || "");
      break;
    case "image-message":
      displayImageMsg("other", data.image, data.sender, data.avatar);
      break;
    case "file-message":
      displayFileMsg("other", data.fileName, data.sizeText, data.sender, data.avatar);
      break;
    case "ai-loading":
      const ld = displayMsg("ai", "思考中", MODES[currentMode].name, "🐕");
      const ldText = ld.querySelector(".ai-text");
      if (ldText) ldText.classList.add("typing-dots");
      break;
    case "ai-start":
      const last = chatBox.querySelector(".msg.ai:last-child");
      if (last) { const t = last.querySelector(".ai-text"); if(t) { t.textContent = ""; t.classList.remove("typing-dots"); } }
      break;
    case "ai-delta":
      const msgs = chatBox.querySelectorAll(".msg.ai");
      const lm = msgs[msgs.length - 1];
      if (lm) { const t = lm.querySelector(".ai-text"); if(t) t.textContent += data.content; }
      chatBox.scrollTop = chatBox.scrollHeight;
      break;
    case "ai-end":
      const all = chatBox.querySelectorAll(".msg.ai");
      const fm = all[all.length - 1];
      if (fm) { const t = fm.querySelector(".ai-text"); if(t) { t.textContent = data.fullContent; t.classList.remove("typing-dots"); } }
      else displayMsg("ai", data.fullContent, MODES[currentMode].name, "🐕");
      break;
    case "ai-error":
      displayMsg("ai", "汪...出错了：" + data.error, MODES[currentMode].name, "🐕");
      break;
    case "msg-ack":
      confirmMsgStatus(data.msgId, data.status);
      break;
    case "room-end-notice":
      showEnded();
      break;
  }
  saveCache();
}

function showEnded() {
  roomEnded = true;
  clearCache();
  document.getElementById("endedOverlay").classList.remove("hidden");
  disableInput("已结束");
}

// ========== RECONNECT (GUEST) ==========
function guestReconnect() {
  if (reconnectCount >= maxReconnect || roomEnded) {
    showBanner("无法重连，房主可能已离线", "warn");
    return;
  }
  reconnectCount++;
  setConnStatus(`重连中 (${reconnectCount}/${maxReconnect})...`, "warn");

  setTimeout(() => {
    if (roomEnded || !peer || peer.destroyed) return;
    try {
      hostConn = peer.connect(roomId, { reliable: true });
      hostConn.on("open", () => {
        reconnectCount = 0;
        setConnStatus("重新连接成功！", "ok");
        enableInput();
        startHeartbeat(hostConn);
        hostConn.on("data", guestHandleData);
        hostConn.on("close", guestDisconnected);
        hostConn.on("error", guestDisconnected);
        hostConn.send({ type: "join", nickname: myName });
        // 恢复房主在线状态
        const hostP = participants.find(p => p.id === roomId);
        if (hostP) { hostP.online = true; updateOnlineBar(); }
      });
      hostConn.on("error", () => guestReconnect());
    } catch(e) { guestReconnect(); }
  }, 2000 * reconnectCount);
}

function guestDisconnected() {
  if (roomEnded) return;
  setConnStatus("连接断开了", "err");
  disableInput("连接断开，正在重连...");
  stopHeartbeat(hostConn);
  // 把房主标记为离线（房主的id就是roomId）
  const hostP = participants.find(p => p.id === roomId);
  if (hostP) { hostP.online = false; updateOnlineBar(); }
  guestReconnect();
}

function showCreateDialog() {

  document.getElementById("createOverlay").classList.remove("hidden");
}

function confirmCreate() {

  const pwd = document.getElementById("createPassword").value.trim();

  }
  hostApiKey = key || null;
  roomPassword = pwd || "";
  isHost = true;
  myName = "房主";
  myAvatar = "👑";

  // Apply selected mode
  if (mode.noAI) {
    messagesHistory = [];
    document.querySelector(".header .title").textContent = "空房间";
    document.getElementById("muteBtn").classList.add("hidden");
  } else {
    messagesHistory = [{ role: "system", content: mode.prompt }];

function joinRoom() {
  const rid = document.getElementById("joinInput").value.trim();
  if (!rid) { alert("请输入房间号~"); return; }
  isHost = false;
  roomId = rid.startsWith("room-") ? rid : rid;
  myName = "连接中";
  myAvatar = "👤";
  document.getElementById("setupScreen").classList.add("hidden");
  enterChat();
  setConnStatus("正在连接房间...", "warn");
  initPeer("guest-" + randomString(8));

  peer.on("open", () => {
    hostConn = peer.connect(roomId, { reliable: true });
    hostConn.on("open", () => {
      setConnStatus("连接成功！", "ok");
      startHeartbeat(hostConn);
      hostConn.on("data", guestHandleData);
      hostConn.on("close", guestDisconnected);
      hostConn.on("error", guestDisconnected);
      hostConn.send({ type: "join", nickname: "用户" + randomString(3) });
    });
    hostConn.on("error", (e) => {
      setConnStatus("连接失败", "err");
      alert("无法连接房主，请确认房间号正确且房主在线~");
      location.reload();
    });
    setTimeout(() => {
      if (!hostConn?.open && !roomEnded) { alert("连接超时啦~"); location.reload(); }
    }, 15000);
  });
}

function recoverHost() {
  const pwd = document.getElementById("recoverInput").value.trim();
  if (!pwd) { alert("请输入房主密码~"); return; }
  const stored = localStorage.getItem("host_rooms");
  if (stored) {
    const rooms = JSON.parse(stored);
    const match = Object.entries(rooms).find(([rid, data]) => data.password === pwd);
    if (match) {
      const [rid, data] = match;
      hostApiKey = data.apiKey;
      roomPassword = pwd;
      roomId = rid;
      isHost = true;
      myName = "房主";
      myAvatar = "👑";
      document.getElementById("setupScreen").classList.add("hidden");
      enterChat();
      document.getElementById("endBtn").classList.remove("hidden");
      setConnStatus("正在回到聊天...", "warn");
      initPeer(rid);
      return;
    }
  }
  alert("找不到匹配的房间，密码可能不对~");
}

function enterChat() {
  document.getElementById("headerBar").classList.remove("hidden");
  document.getElementById("onlineBar").classList.remove("hidden");
  document.getElementById("inputArea").classList.remove("hidden");
  // Try restoring cached chat if available
  if (roomId) {
    const cached = loadCache(roomId);
    if (cached) {
      participants = cached.participants || [];
      updateOnlineBar();
    }
  }
}

function endRoom() {
  if (!confirm("确定要结束吗？所有人的聊天记录都会删除哦~")) return;
  if (isHost) {
    roomEnded = true;
    broadcastToAll({ type: "room-end-notice" });
    clearCache();
    localStorage.removeItem("host_rooms");
    disableInput("已结束");
    document.getElementById("endBtn").classList.add("hidden");
    showBanner("聊天结束啦~ 记录已清除", "end");
    setTimeout(() => { connections.forEach(c => { try{c.close();}catch(e){} }); connections = []; }, 1000);
  } else {
    // 访客请求结束，通知房主
    if (hostConn?.open) hostConn.send({ type: "request-end" });
  }
}

function sendMyMessage() {

  userInput.value = "";

  document.getElementById("emojiPanel").classList.remove("show");

  document.getElementById("invitePanel").classList.remove("show");
  chatStarted = true;

  const mid = "m" + (++msgIdCounter) + "_" + Date.now();

  if (isHost) {
    displayMsg("self", text, myName, myAvatar, mid);
    confirmMsgStatus(mid, "ok");
    broadcastToAll({ type: "chat-message", text, sender: myName, avatar: myAvatar });
    if (!aiMuted) triggerAIDebounced(`${myName}: ${text}`);
  } else {
    if (hostConn?.open) {
      displayMsg("self", text, myName, myAvatar, mid);
      hostConn.send({ type: "chat-message", text, msgId: mid });
      setTimeout(() => {
        const el = chatBox.querySelector(`[data-mid="${mid}"]`);
        if (el && el.textContent === '发送中') confirmMsgStatus(mid, 'fail');
      }, 8000);
    } else {
      alert("连接断了，等一下重连~");
    }
  }
}

// ========== VOICE MESSAGE ==========
let mediaRecorder = null, audioChunks = [], voiceStartTime = 0, voiceTimer = null, voiceCancelled = false;
let speechRecognition = null, voiceTranscript = "";

function startVoice(e) {
  e.preventDefault();
  if (roomEnded) return;
  voiceCancelled = false;
  voiceTranscript = "";
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    audioChunks = [];
    voiceStartTime = Date.now();
    // 显示录制提示
    const hint = document.createElement("div");
    hint.className = "voice-recording-hint";
    hint.id = "voiceHint";
    hint.textContent = "松开发送，上滑取消";
    document.getElementById("inputArea").style.position = "relative";
    document.getElementById("inputArea").appendChild(hint);
    document.getElementById("micBtn").classList.add("recording");

    // 启动语音识别
    try {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SR) {
        speechRecognition = new SR();
        speechRecognition.lang = "zh-CN";
        speechRecognition.continuous = true;
        speechRecognition.interimResults = true;
        speechRecognition.onresult = (ev) => {
          let text = "";
          for (let i = 0; i < ev.results.length; i++) {
            text += ev.results[i][0].transcript;
          }
          voiceTranscript = text;
        };
        speechRecognition.start();
      }
    } catch(e) {}

    mediaRecorder = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/mp4' });
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      // 停止语音识别
      if (speechRecognition) { try { speechRecognition.stop(); } catch(e){} speechRecognition = null; }
      if (voiceCancelled || audioChunks.length === 0) return;
      const dur = Math.round((Date.now() - voiceStartTime) / 1000);
      if (dur < 1) { displayNotice("说话时间太短"); return; }
      const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
      const reader = new FileReader();
      reader.onloadend = () => {
        const base64 = reader.result;
        sendVoiceMsg(base64, dur, voiceTranscript);
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start();

    // 最长60秒自动停止
    voiceTimer = setTimeout(() => { stopVoice(); }, 60000);
  }).catch(() => { alert("无法访问麦克风"); });
}

function stopVoice(e) {
  if (e) e.preventDefault();
  clearTimeout(voiceTimer);
  const hint = document.getElementById("voiceHint");
  if (hint) hint.remove();
  document.getElementById("micBtn").classList.remove("recording");
  if (speechRecognition) { try { speechRecognition.stop(); } catch(e){} }
  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
  }
}

function cancelVoice() {
  voiceCancelled = true;
  if (speechRecognition) { try { speechRecognition.abort(); } catch(e){} speechRecognition = null; }
  stopVoice();
}

function sendVoiceMsg(base64Data, duration, transcript) {
  const mid = "m" + (++msgIdCounter) + "_" + Date.now();
  const text = transcript || "";
  if (isHost) {
    displayVoiceMsg("self", base64Data, duration, myName, myAvatar, mid, text);
    confirmMsgStatus(mid, "ok");
    broadcastToAll({ type: "voice-message", audio: base64Data, duration, sender: myName, avatar: myAvatar, transcript: text });
    if (!aiMuted && text) triggerAIDebounced(`${myName}(语音): ${text}`);
  } else {
    if (hostConn?.open) {
      displayVoiceMsg("self", base64Data, duration, myName, myAvatar, mid, text);
      hostConn.send({ type: "voice-message", audio: base64Data, duration, transcript: text, msgId: mid });
    }
  }
  chatStarted = true;
}

function displayVoiceMsg(who, audioData, duration, name, avatar, msgId, transcript) {
  const div = document.createElement("div");
  div.className = `msg ${who}`;
  if (msgId) div.dataset.msgId = msgId;
  const durText = duration + '"';
  const transcriptHtml = transcript ? `<div class="voice-transcript">${transcript}</div>` : '';
  if (who === "self") {
    div.innerHTML = `<div class="bubble"><div class="voice-msg" onclick="playVoice(this)" data-audio="${audioData}"><span class="voice-icon">🔊</span><span class="voice-dur">${durText}</span></div>${transcriptHtml}</div><span class="msg-status">✓</span>`;
  } else {
    div.innerHTML = `<span class="avatar">${avatar}</span><div class="bubble"><div class="sender-name">${name}</div><div class="voice-msg" onclick="playVoice(this)" data-audio="${audioData}"><span class="voice-icon">🔊</span><span class="voice-dur">${durText}</span></div>${transcriptHtml}</div>`;
  }
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

function playVoice(el) {
  document.querySelectorAll('.voice-msg.playing').forEach(v => v.classList.remove('playing'));
  el.classList.add('playing');
  const audio = new Audio(el.dataset.audio);
  audio.onended = () => el.classList.remove('playing');
  audio.onerror = () => el.classList.remove('playing');
  audio.play();
}

// ========== IMAGE & FILE ==========
function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = "";
  if (file.size > 5 * 1024 * 1024) { alert("文件不能超过5MB"); return; }

  const reader = new FileReader();
  reader.onloadend = () => {
    const base64 = reader.result;
    const isImage = file.type.startsWith("image/");
    if (isImage) {
      sendImageMsg(base64, file.name);
    } else {
      // 文本类文件读内容给AI
      sendFileMsg(base64, file.name, file.size, file.type);
    }
  };
  reader.readAsDataURL(file);
}

function sendImageMsg(base64Data, fileName) {
  const mid = "m" + (++msgIdCounter) + "_" + Date.now();
  if (isHost) {
    displayImageMsg("self", base64Data, myName, myAvatar, mid);
    confirmMsgStatus(mid, "ok");
    broadcastToAll({ type: "image-message", image: base64Data, sender: myName, avatar: myAvatar });
    if (!aiMuted && !MODES[currentMode].noAI) triggerAIDebounced(`${myName}: [发了一张图片]`);
  } else {
    if (hostConn?.open) {
      displayImageMsg("self", base64Data, myName, myAvatar, mid);
      hostConn.send({ type: "image-message", image: base64Data, msgId: mid });
    }
  }
  chatStarted = true;
}

function sendFileMsg(base64Data, fileName, fileSize, fileType) {
  const mid = "m" + (++msgIdCounter) + "_" + Date.now();
  const sizeText = fileSize < 1024 ? fileSize + 'B' : (fileSize / 1024).toFixed(1) + 'KB';
  if (isHost) {
    displayFileMsg("self", fileName, sizeText, myName, myAvatar, mid);
    confirmMsgStatus(mid, "ok");
    broadcastToAll({ type: "file-message", fileName, sizeText, sender: myName, avatar: myAvatar });
    // 文本类文件内容发给AI理解
    if (!aiMuted && !MODES[currentMode].noAI) {
      // base64解码获取文件文本内容
      try {
        const textContent = atob(base64Data.split(',')[1]);
        const preview = textContent.substring(0, 2000);
        triggerAIDebounced(`${myName}: [上传了文件 ${fileName}，内容如下]\n${preview}`);
      } catch(e) {
        triggerAIDebounced(`${myName}: [上传了文件 ${fileName}]`);
      }
    }
  } else {
    if (hostConn?.open) {
      displayFileMsg("self", fileName, sizeText, myName, myAvatar, mid);
      hostConn.send({ type: "file-message", fileName, sizeText, fileData: base64Data, msgId: mid });
    }
  }
  chatStarted = true;
}
